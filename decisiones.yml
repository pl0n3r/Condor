    {"id":"D-054","status":"active","text":"En fase construction, las migraciones versionadas aditivas/expand-compatible solo pueden ejecutarse automáticamente tras dry-run y allowlist completos, backup previo exitoso y CONDOR_AUTO_MIGRATE habilitado; live, CONDOR_AUTO_MIGRATE=0 o cualquier fallo de validación, migración o recheck deben fallar cerrado."},
    {"id":"D-055","status":"active","text":"Durante fase construccion se permiten escrituras autónomas en producción con trazabilidad y backup; SQL destructivo o borrado irreversible requiere autorización explícita."},
    {"id":"D-056","status":"active","text":"Los releases se publican mediante el kit Factory y se validan por versión/SHA exactos."},
    {"id":"D-057","status":"active","text":"Todo Issue y PR debe tener exactamente una etiqueta de tipo, una de prioridad y una de estado."},
    {"id":"D-058","status":"active","text":"Cada tarea declara y aplica los roles profesionales que exige; la automatización no genera trabajo manual para el dueño."},
    {"id":"D-059","status":"active","text":"Todo cambio que agregue, modifique o elimine datos personales, formularios que los recojan o servicios externos que los reciban debe actualizar datos.yml en el mismo PR y regenerar los documentos cuando exista generador; si cambia una finalidad, entra un dato sensible o un proveedor nuevo recibe datos, debe abrirse una puerta legal; los datos del responsable permanecen como [COMPLETAR POR EL DUEÑO] hasta la puerta go-live."}
  ]
}
