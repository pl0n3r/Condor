<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Condor App — Estamos construyendo</title>
  <meta name="description" content="Condor App está en construcción. Plataforma de gestión corporativa para empresas colombianas.">
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f7fb;
      background: #0b0d10;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.08), transparent 34rem),
        #0b0d10;
    }
    main {
      width: min(720px, 100%);
      padding: clamp(28px, 6vw, 64px);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 24px;
      background: rgba(255,255,255,.04);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    .eyebrow {
      margin: 0 0 18px;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #aab2bd;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 10vw, 6rem);
      line-height: .95;
      letter-spacing: -.06em;
    }
    p {
      margin: 24px 0 0;
      max-width: 52ch;
      color: #c8ced8;
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.65;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 34px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      color: #dde2ea;
      font-size: .9rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7cf29a;
      box-shadow: 0 0 0 6px rgba(124,242,154,.12);
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Condor App</p>
    <h1>Estamos construyendo.</h1>
    <p>
      Una plataforma flexible para ayudar a empresas colombianas a digitalizar
      y administrar mejor su operación.
    </p>
    <div class="status" aria-label="Estado del sitio">
      <span class="dot" aria-hidden="true"></span>
      Sitio en preparación
    </div>
  </main>
</body>
</html>
