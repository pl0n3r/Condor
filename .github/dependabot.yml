version: 2
# Actualizaciones agrupadas y mensuales: pocos PRs, para no cargar GitHub ni a los agentes.
# Los majors se planifican explícitamente: no deben abrir PRs automáticos fuera del stack vigente.
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      composer-minor:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "tipo: mejora"
      - "prioridad: media"
      - "estado: en revisión"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      npm-minor:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "tipo: mejora"
      - "prioridad: media"
      - "estado: en revisión"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      github-actions-minor:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "tipo: mejora"
      - "prioridad: media"
      - "estado: en revisión"
