name: CI Condor (V 0.1.0)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-condor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      categoria_documentacion: ${{ steps.cambios.outputs.categoria_documentacion }}
      categoria_gobierno: ${{ steps.cambios.outputs.categoria_gobierno }}
      categoria_frontend: ${{ steps.cambios.outputs.categoria_frontend }}
      categoria_backend: ${{ steps.cambios.outputs.categoria_backend }}
      categoria_migraciones: ${{ steps.cambios.outputs.categoria_migraciones }}
      categoria_dependencias: ${{ steps.cambios.outputs.categoria_dependencias }}
      categoria_seguridad: ${{ steps.cambios.outputs.categoria_seguridad }}
      categoria_release: ${{ steps.cambios.outputs.categoria_release }}
      documentacion: ${{ steps.cambios.outputs.documentacion }}
      pruebas_base: ${{ steps.cambios.outputs.pruebas_base }}
      frontend: ${{ steps.cambios.outputs.frontend }}
      backend: ${{ steps.cambios.outputs.backend }}
      e2e: ${{ steps.cambios.outputs.e2e }}
      validacion_completa: ${{ steps.cambios.outputs.validacion_completa }}
      transicion_release: ${{ steps.cambios.outputs.transicion_release }}
      modo: ${{ steps.cambios.outputs.modo }}
      motivo: ${{ steps.cambios.outputs.motivo }}
      categorias: ${{ steps.cambios.outputs.categorias }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validar título de Pull Request
        if: github.event_name == 'pull_request'
        env:
          TITULO_PR: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [[ ! "$TITULO_PR" =~ \(V\ [0-9]+\.[0-9]+\.[0-9]+\)$ ]]; then
            echo "::error::El título del PR debe terminar con el formato exacto (V X.Y.Z)."
            exit 1
          fi

      - name: Clasificar cambios
        id: cambios
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          PUSH_ANTES: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENTO" == "pull_request" ]]; then
            base="$BASE_PR"
          elif [[ "$EVENTO" == "push" && -n "$PUSH_ANTES" && "$PUSH_ANTES" != "0000000000000000000000000000000000000000" ]]; then
            base="$PUSH_ANTES"
          else
            base=""
          fi

          if [[ -n "$base" ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --name-only "$base" "$GITHUB_SHA" > /tmp/archivos-ci.txt
          else
            git ls-files > /tmp/archivos-ci.txt
          fi

          cat /tmp/archivos-ci.txt
          python3 scripts/ci_change_classifier.py \
            --event "$EVENTO" \
            --format github \
            < /tmp/archivos-ci.txt \
            | tee -a "$GITHUB_OUTPUT"

      - name: Resumen preflight
        env:
          MODO: ${{ steps.cambios.outputs.modo }}
          MOTIVO: ${{ steps.cambios.outputs.motivo }}
          CATEGORIAS: ${{ steps.cambios.outputs.categorias }}
          DOCUMENTACION: ${{ steps.cambios.outputs.documentacion }}
          PRUEBAS_BASE: ${{ steps.cambios.outputs.pruebas_base }}
          FRONTEND: ${{ steps.cambios.outputs.frontend }}
          BACKEND: ${{ steps.cambios.outputs.backend }}
          E2E: ${{ steps.cambios.outputs.e2e }}
          COMPLETA: ${{ steps.cambios.outputs.validacion_completa }}
          TRANSICION: ${{ steps.cambios.outputs.transicion_release }}
        run: |
          set -euo pipefail
          decision() {
            if [[ "$1" == "true" ]]; then printf 'ejecutar'; else printf 'omitir'; fi
          }
          {
            echo "## Preflight Condor"
            echo
            printf -- '- Evento: `%s`\n' "$GITHUB_EVENT_NAME"
            printf -- '- SHA: `%s`\n' "$GITHUB_SHA"
            printf -- '- Modo: **%s**\n' "$MODO"
            printf -- '- Categorías: `%s`\n' "$CATEGORIAS"
            printf -- '- Motivo: `%s`\n' "$MOTIVO"
            printf -- '- Validación completa: `%s`\n' "$COMPLETA"
            printf -- '- Transición de release requerida: `%s`\n' "$TRANSICION"
            echo
            echo "| Gate | Decisión | Razón |"
            echo "| --- | --- | --- |"
            printf '| Documentación | **%s** | categoría documental: `%s` |\n' "$(decision "$DOCUMENTACION")" "$DOCUMENTACION"
            printf '| Gobierno | **ejecutar** | invariante obligatoria del repositorio |\n'
            printf '| Coordinación | **ejecutar** | reserva y colisiones siempre verificables |\n'
            printf '| Contratos/integración | **%s** | %s |\n' "$(decision "$PRUEBAS_BASE")" "$MOTIVO"
            printf '| Frontend rápido | **%s** | %s |\n' "$(decision "$FRONTEND")" "$MOTIVO"
            printf '| Backend/MariaDB | **%s** | %s |\n' "$(decision "$BACKEND")" "$MOTIVO"
            printf '| Playwright/runtime | **%s** | %s |\n' "$(decision "$E2E")" "$MOTIVO"
          } >> "$GITHUB_STEP_SUMMARY"

  documentacion:
    name: Validar documentación
    needs: preflight
    if: needs.preflight.outputs.documentacion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validar documentación
        run: python3 scripts/validar_documentacion.py

  gobierno:
    name: Validar gobierno del repositorio
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validar archivos canónicos
        run: |
          set -euo pipefail
          for archivo in \
            AGENTES.md \
            ESPECIFICACIONES.md \
            GLOSARIO.md \
            README.md \
            ROADMAP.md \
            .github/workflows/coordinacion-trabajo.yml \
            .github/workflows/sonar-annotation-relay.yml \
            .github/workflows/ci-throughput-telemetry.yml \
            scripts/coordinar_trabajo.py \
            scripts/ci_change_classifier.py \
            scripts/ci_retry.py \
            scripts/ci_self_audit.py \
            scripts/ci_throughput_report.py \
            tests/test_coordinar_trabajo.py \
            tests/test_ci_change_classifier.py \
            tests/test_ci_retry.py \
            tests/test_ci_self_audit.py \
            tests/test_ci_throughput_report.py \
            package.json \
            package-lock.json \
            playwright.config.mjs \
            tests/contract/test_tooling_contract.py \
            tests/integration/test_tooling_integration.py \
            tests/e2e/harness.spec.mjs; do
            test -f "$archivo" || { echo "::error::Falta $archivo"; exit 1; }
          done
          test ! -e AGENTS.md || { echo "::error::AGENTS.md no debe existir; el archivo canónico es AGENTES.md"; exit 1; }

      - name: Autoauditar CI
        run: python3 scripts/ci_self_audit.py

      - name: Validar configuración de labels
        run: python3 -m json.tool .github/labels.json >/dev/null

      - name: Validar títulos predeterminados de Issues
        run: |
          set -euo pipefail
          for archivo in .github/ISSUE_TEMPLATE/*.yml; do
            [[ "$(basename "$archivo")" == "config.yml" ]] && continue
            titulo="$(grep -m1 '^title:' "$archivo" | sed -E 's/^title:[[:space:]]*"?([^"]*)"?$/\1/')"
            if [[ ! "$titulo" =~ \(V\ [0-9]+\.[0-9]+\.[0-9]+\)$ ]]; then
              echo "::error file=$archivo::El título predeterminado debe terminar con (V X.Y.Z)."
              exit 1
            fi
          done

  coordinacion:
    name: Validar coordinación
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Probar reglas de coordinación
        run: python3 -m unittest tests/test_coordinar_trabajo.py

      - name: Validar reserva y colisiones
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          argumentos=()
          if git cat-file -e "$BASE_SHA:.github/workflows/coordinacion-trabajo.yml" 2>/dev/null; then
            argumentos+=(--require-reservation)
          else
            echo "Bootstrap: la base aún no contiene coordinación multiagente; se validan rama, Issue y colisiones."
          fi
          python3 scripts/coordinar_trabajo.py validar-pr \
            --repo "$REPOSITORIO" \
            --pr "$PR" \
            "${argumentos[@]}"

  pruebas-base:
    name: Pruebas de contrato e integración
    needs: preflight
    if: needs.preflight.outputs.pruebas_base == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Probar herramientas internas del CI
        run: python3 -m unittest discover -s tests -p 'test_ci_*.py'

      - name: Ejecutar contratos
        run: python3 -m unittest discover -s tests/contract -p 'test_*.py'

      - name: Ejecutar integraciones
        run: python3 -m unittest discover -s tests/integration -p 'test_*.py'

  backend-php:
    name: Backend PHP / MariaDB
    needs: preflight
    if: needs.preflight.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: condor_test
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      APP_DEBUG: 0
      DATABASE_URL: mysql://root@127.0.0.1:3306/condor_test?serverVersion=mariadb-11.4.0&charset=utf8mb4
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none

      - name: Generar secretos efímeros de CI
        run: |
          set -euo pipefail
          app_secret="$(openssl rand -hex 32)"
          owner_password="$(openssl rand -base64 32)"
          echo "::add-mask::$app_secret"
          echo "::add-mask::$owner_password"
          echo "APP_SECRET=$app_secret" >> "$GITHUB_ENV"
          echo "CONDOR_OWNER_PASSWORD=$owner_password" >> "$GITHUB_ENV"

      - name: Instalar dependencias PHP
        run: |
          python3 scripts/ci_retry.py \
            --attempts 3 \
            --base-delay 3 \
            --label "composer install" \
            -- composer install --no-interaction --prefer-dist --no-progress

      - name: Validar Composer y sintaxis PHP
        run: |
          set -euo pipefail
          composer validate --strict
          find src config migrations public -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l bin/console

      - name: Validar configuración Symfony
        run: |
          set -euo pipefail
          php bin/console lint:yaml config
          php bin/console lint:twig templates
          php bin/console about

      - name: Aplicar migraciones en MariaDB descartable
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Ejecutar pruebas PHP
        run: vendor/bin/simple-phpunit

      - name: Probar onboarding transaccional
        run: |
          set -euo pipefail
          php bin/console app:onboarding:create \
            --name="Empresa CI" \
            --slug="empresa-ci" \
            --legal-name="Empresa CI SAS" \
            --nit="900000001-1" \
            --branch="Principal" \
            --email="owner-ci@example.test" \
            --owner-name="Propietario CI"
          php bin/console doctrine:query:sql "SELECT id, slug FROM condor_tenant WHERE slug = 'empresa-ci'" | grep -q 'empresa-ci'

      - name: Smoke HTTP y login real
        run: |
          set -euo pipefail
          app_version="$(php -r '$config = require "config/version.php"; echo $config["version"] ?? "";')"
          test -n "$app_version"

          php -S 127.0.0.1:8080 -t public public/router.php >/tmp/condor-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for intento in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json; then
              ready=true
              break
            fi
            sleep 0.5
          done

          if [[ "$ready" != "true" ]]; then
            cat /tmp/condor-http.log
            exit 1
          fi

          grep -q '"status":"ok"' /tmp/health.json
          grep -q "\"version\":\"$app_version\"" /tmp/health.json
          curl -fsS http://127.0.0.1:8080/ | grep -q "V $app_version"
          curl -fsS -c /tmp/cookies.txt http://127.0.0.1:8080/admin/login >/tmp/login.html
          grep -q "V $app_version" /tmp/login.html

          token="$(python3 -c 'import html,re; body=open("/tmp/login.html",encoding="utf-8").read(); m=re.search(r"name=\"_csrf_token\" value=\"([^\"]+)\"",body); assert m; print(html.unescape(m.group(1)))')"

          code="$(curl -sS -o /tmp/login-response.html -w '%{http_code}' \
            -b /tmp/cookies.txt -c /tmp/cookies.txt \
            --data-urlencode "_username=owner-ci@example.test" \
            --data-urlencode "_password=$CONDOR_OWNER_PASSWORD" \
            --data-urlencode "_csrf_token=$token" \
            http://127.0.0.1:8080/admin/login)"
          test "$code" = "302"
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:8080/admin | grep -q 'Empresa CI'

  e2e:
    name: Playwright Chromium
    needs: preflight
    if: needs.preflight.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: condor_e2e
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      APP_DEBUG: 0
      DATABASE_URL: mysql://root@127.0.0.1:3306/condor_e2e?serverVersion=mariadb-11.4.0&charset=utf8mb4
      RELEASE_SHA: ${{ github.sha }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
      E2E_EMAIL: owner-e2e@example.test
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none

      - name: Resolver versión de aplicación
        run: |
          set -euo pipefail
          app_version="$(php -r '$config = require "config/version.php"; echo $config["version"] ?? "";')"
          test -n "$app_version"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"

      - name: Preparar secretos efímeros
        run: |
          set -euo pipefail
          app_secret="$(openssl rand -hex 32)"
          e2e_password="$(openssl rand -base64 32)"
          echo "::add-mask::$app_secret"
          echo "::add-mask::$e2e_password"
          echo "APP_SECRET=$app_secret" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$e2e_password" >> "$GITHUB_ENV"
          echo "CONDOR_OWNER_PASSWORD=$e2e_password" >> "$GITHUB_ENV"

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias reproducibles
        run: |
          set -euo pipefail
          python3 scripts/ci_retry.py \
            --attempts 3 \
            --base-delay 3 \
            --label "npm ci" \
            -- npm ci --ignore-scripts --no-audit --no-fund
          python3 scripts/ci_retry.py \
            --attempts 3 \
            --base-delay 3 \
            --label "composer install E2E" \
            -- composer install --no-interaction --prefer-dist --no-progress

      - name: Validar y construir frontend
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build:admin
          test -s public/build/admin.js
          test -s public/build/admin.css
          git diff --exit-code -- public/build

      - name: Preparar base E2E
        run: |
          set -euo pipefail
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console app:onboarding:create \
            --name="Empresa E2E" \
            --slug="empresa-e2e" \
            --legal-name="Empresa E2E SAS" \
            --branch="Principal" \
            --email="$E2E_EMAIL" \
            --owner-name="Propietario E2E"

      - name: Iniciar aplicación
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t public public/router.php >/tmp/condor-e2e-http.log 2>&1 &
          echo "$!" > /tmp/condor-e2e-http.pid
          for intento in {1..30}; do
            if curl -fsS "$PLAYWRIGHT_BASE_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/condor-e2e-http.log
          exit 1

      - name: Registrar navegador del runner
        run: |
          set -euo pipefail
          version="$(google-chrome --version)"
          echo "Navegador E2E: $version"
          echo "- Navegador E2E: **$version**" >> "$GITHUB_STEP_SUMMARY"

      - name: Instalar ffmpeg de Playwright para evidencia de fallo
        run: |
          python3 scripts/ci_retry.py \
            --attempts 3 \
            --base-delay 2 \
            --label "Playwright ffmpeg" \
            -- ./node_modules/.bin/playwright install ffmpeg

      - name: Ejecutar Playwright
        run: npm run test:e2e

      - name: Detener aplicación
        if: always()
        run: |
          if [[ -f /tmp/condor-e2e-http.pid ]]; then
            kill "$(cat /tmp/condor-e2e-http.pid)" 2>/dev/null || true
          fi

      - name: Conservar evidencia solo si falla
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-fallo-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            /tmp/condor-e2e-http.log
          retention-days: 14
          if-no-files-found: ignore

  validar:
    name: Validar
    needs: [preflight, documentacion, gobierno, coordinacion, pruebas-base, backend-php, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consolidar gates
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          DOCUMENTACION: ${{ needs.documentacion.result }}
          GOBIERNO: ${{ needs.gobierno.result }}
          COORDINACION: ${{ needs.coordinacion.result }}
          PRUEBAS_BASE: ${{ needs.pruebas-base.result }}
          BACKEND_PHP: ${{ needs.backend-php.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail

          [[ "$PREFLIGHT" == "success" ]] || { echo "::error::Preflight no pasó."; exit 1; }
          [[ "$GOBIERNO" == "success" ]] || { echo "::error::Gobierno no pasó."; exit 1; }
          [[ "$COORDINACION" == "success" ]] || { echo "::error::Coordinación no pasó."; exit 1; }
          case "$PRUEBAS_BASE" in
            success|skipped) ;;
            *) echo "::error::Pruebas base no pasaron."; exit 1 ;;
          esac

          case "$BACKEND_PHP" in
            success|skipped) ;;
            *) echo "::error::Backend PHP no pasó."; exit 1 ;;
          esac

          case "$E2E" in
            success|skipped) ;;
            *) echo "::error::Playwright no pasó."; exit 1 ;;
          esac

          case "$DOCUMENTACION" in
            success|skipped) ;;
            *) echo "::error::Documentación no pasó."; exit 1 ;;
          esac

          {
            echo "## Resultado CI Condor"
            echo
            echo "- Preflight: **$PREFLIGHT**"
            echo "- Documentación: **$DOCUMENTACION**"
            echo "- Gobierno: **$GOBIERNO**"
            echo "- Coordinación: **$COORDINACION**"
            echo "- Pruebas base: **$PRUEBAS_BASE**"
            echo "- Backend PHP: **$BACKEND_PHP**"
            echo "- Playwright: **$E2E**"
            echo "- Resultado agregado: **success**"
          } >> "$GITHUB_STEP_SUMMARY"
