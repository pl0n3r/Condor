name: Resolver Composer #2022 (temporal)
on:
  push:
    branches: [trabajo/issue-2022]
    paths: [.github/workflows/issue-2022-composer-resolve.yml]
permissions:
  contents: read
jobs:
  resolve:
    if: github.repository == 'pl0n3r/Condor' && github.ref == 'refs/heads/trabajo/issue-2022'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
      - name: Resolver parches oficiales Symfony 7.4
        run: |
          set -euo pipefail
          php --version
          composer --version
          composer update symfony/doctrine-bridge symfony/framework-bundle symfony/http-kernel symfony/mailer symfony/routing symfony/security-core symfony/security-http --with-all-dependencies --minimal-changes --no-install --no-scripts --no-plugins --no-interaction --no-progress
          composer validate --no-check-publish --no-plugins
          composer audit --locked --no-interaction --no-plugins
          php -r '$l=json_decode(file_get_contents("composer.lock"),true,512,JSON_THROW_ON_ERROR); $need=array_fill_keys(["symfony/doctrine-bridge","symfony/framework-bundle","symfony/http-kernel","symfony/mailer","symfony/routing","symfony/security-core","symfony/security-http"],false); foreach ($l["packages"] as $p) { if (array_key_exists($p["name"],$need)) { if (!preg_match("/^v?7\\.4\\./",$p["version"]) || version_compare(ltrim($p["version"],"v"),"7.4.24","<")) exit(1); $need[$p["name"]]=true; echo $p["name"]." ".$p["version"].PHP_EOL; }} if (in_array(false,$need,true)) exit(1);'
          git diff --exit-code -- composer.json
          sha256sum composer.lock
          printf 'LOCK_GIT_BLOB=%s\n' "$(git hash-object composer.lock)"
          # Transport the public lock verbatim, with a digest for independent verification.
          base64 -w 120 composer.lock | sed 's/^/LOCK_B64:/'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: composer-lock-2022
          path: composer.lock
          if-no-files-found: error
          retention-days: 1
