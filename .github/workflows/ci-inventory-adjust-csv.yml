name: Condor Inventory CSV Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Application/Inventory/StockCsvAdjuster.php'
      - 'src/Http/Controller/InventoryCsvAdjustController.php'
      - 'tests/test_inventory_adjust_csv_api.py'
      - '.github/workflows/ci-inventory-adjust-csv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-csv-acceptance:
    name: AC-01 ajuste CSV real
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout HEAD exacto del PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: PHP 8.5 sin extensiones externas
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none

      - name: Ejecutar AC-01 y negativos con PHP real
        run: |
          set -euo pipefail
          python3 tests/test_inventory_adjust_csv_api.py -v
