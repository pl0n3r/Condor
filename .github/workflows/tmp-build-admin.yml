name: TEMP sync admin build

on:
  push:
    branches:
      - trabajo/issue-171

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: trabajo/issue-171
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Compilar y cerrar helper temporal
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build:admin

          git add public/build/admin.js public/build/admin.css
          git rm .github/workflows/tmp-build-admin.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sincroniza bundle de inventario (#171)"
          git push origin HEAD:trabajo/issue-171
