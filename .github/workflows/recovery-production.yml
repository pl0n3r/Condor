name: Recovery production drill

on:
  workflow_dispatch:

concurrency:
  group: recovery-production-condor
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CONNECTION_REF: ${{ vars.RECOVERY_PRIMARY_CONNECTION_REF }}
      PRIVACY_REF: ${{ vars.RECOVERY_PROVIDER_PRIVACY_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/FactoryRunner
          ref: 45f5571ac32fbe07d11e696098f4e5902fac8c7f
          path: _factoryrunner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/Factory
          ref: bb732b0feb2b5f45b9d9f96efe257c289e76bbc9
          path: _factory
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Preflight gobernado
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RECOVERY_S3_ENDPOINT: ${{ secrets.RECOVERY_S3_ENDPOINT }}
          RECOVERY_S3_BUCKET: ${{ secrets.RECOVERY_S3_BUCKET }}
          RECOVERY_S3_REGION: ${{ secrets.RECOVERY_S3_REGION }}
          RECOVERY_S3_PREFIX: ${{ secrets.RECOVERY_S3_PREFIX }}
          RECOVERY_S3_ACCESS_KEY_ID: ${{ secrets.RECOVERY_S3_ACCESS_KEY_ID }}
          RECOVERY_S3_SECRET_ACCESS_KEY: ${{ secrets.RECOVERY_S3_SECRET_ACCESS_KEY }}
          RECOVERY_S3_OBJECT_LOCK_DAYS: ${{ secrets.RECOVERY_S3_OBJECT_LOCK_DAYS }}
          RECOVERY_DISPOSABLE_DATABASE_URL: ${{ secrets.RECOVERY_DISPOSABLE_DATABASE_URL }}
          CONDOR_RECOVERY_ENCRYPTION_PASSPHRASE: ${{ secrets.CONDOR_RECOVERY_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          root="$HOME/.condor-recovery"; mkdir -p "$root"; chmod 700 "$root"
          python3 scripts/recovery-production.py preflight --connection-ref "$CONNECTION_REF" --privacy-ref "$PRIVACY_REF" >/dev/null
          for name in DATABASE_URL RECOVERY_S3_ENDPOINT RECOVERY_S3_BUCKET RECOVERY_S3_REGION RECOVERY_S3_PREFIX RECOVERY_S3_ACCESS_KEY_ID RECOVERY_S3_SECRET_ACCESS_KEY RECOVERY_S3_OBJECT_LOCK_DAYS RECOVERY_DISPOSABLE_DATABASE_URL CONDOR_RECOVERY_ENCRYPTION_PASSPHRASE; do
            [[ -n "${!name:-}" ]] || { echo "::error::Recovery live no provisionado"; exit 1; }
          done

      - name: Preparar PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none

      - name: Instalar dependencias PHP reproducibles
        run: |
          python3 scripts/ci_retry.py             --attempts 3             --base-delay 3             --label "composer install recovery drill"             -- composer install --no-interaction --prefer-dist --no-progress

      - name: Backup y cifrado cliente
        id: backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONDOR_RECOVERY_ENCRYPTION_PASSPHRASE: ${{ secrets.CONDOR_RECOVERY_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          root="$HOME/.condor-recovery"
          created_at="$(date +%s)"
          BACKUP_DIR="$root" sh scripts/backup-database.sh >/dev/null
          plain="$(find "$root" -maxdepth 1 -type f -name 'condor-*.sql.gz' -print | sort | tail -1)"
          [[ -n "$plain" ]] || { echo "::error::Backup ausente"; exit 1; }
          plain_name="$(basename "$plain")"
          python3 scripts/recovery-production.py encrypt --source "$plain_name" --target backup.enc >/dev/null
          rm -f -- "$plain"
          checksum="$(python3 scripts/recovery-production.py checksum --artifact backup.enc | python3 -c 'import json,sys;print(json.load(sys.stdin)["checksum_sha256"])')"
          echo "artifact=$root/backup.enc" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "created_at=$created_at" >> "$GITHUB_OUTPUT"

      - name: Offsite versionado e inmutable
        id: offsite
        env:
          FACTORYRUNNER_CONNECTION_RECOVERY_PRIMARY_ENDPOINT: ${{ secrets.RECOVERY_S3_ENDPOINT }}
          FACTORYRUNNER_CONNECTION_RECOVERY_PRIMARY_BUCKET: ${{ secrets.RECOVERY_S3_BUCKET }}
          FACTORYRUNNER_CONNECTION_RECOVERY_PRIMARY_REGION: ${{ secrets.RECOVERY_S3_REGION }}
          FACTORYRUNNER_CONNECTION_RECOVERY_PRIMARY_PREFIX: ${{ secrets.RECOVERY_S3_PREFIX }}
          FACTORYRUNNER_CONNECTION_RECOVERY_PRIMARY_ACCESS_KEY_ID: ${{ secrets.RECOVERY_S3_ACCESS_KEY_ID }}
          FACTORYRUNNER_CONNECTION_RECOVERY_PRIMARY_SECRET_ACCESS_KEY: ${{ secrets.RECOVERY_S3_SECRET_ACCESS_KEY }}
          FACTORYRUNNER_CONNECTION_RECOVERY_PRIMARY_OBJECT_LOCK_DAYS: ${{ secrets.RECOVERY_S3_OBJECT_LOCK_DAYS }}
          FACTORYRUNNER_CONNECTION_RECOVERY_PRIMARY_AWS_SECURITY_TOKEN: ${{ secrets.RECOVERY_S3_AWS_SECURITY_TOKEN }}
          BACKUP_CHECKSUM: ${{ steps.backup.outputs.checksum }}
          BACKUP_ARTIFACT: ${{ steps.backup.outputs.artifact }}
        run: |
          set -euo pipefail
          root="$HOME/.condor-recovery"
          object_ref="condor:db:${GITHUB_RUN_ID}:${BACKUP_CHECKSUM}"
          for op in upload verify; do
            python3 scripts/recovery-production.py descriptor --operation "$op" --checksum "$BACKUP_CHECKSUM" --object-ref "$object_ref" --connection-ref "$CONNECTION_REF" >"$root/$op.json"
            FACTORYRUNNER_RECOVERY_ARTIFACT_ROOT="$root" FACTORYRUNNER_RECOVERY_ARTIFACT_PATH="$BACKUP_ARTIFACT" node --experimental-strip-types _factoryrunner/scripts/recovery-live-object-storage.ts <"$root/$op.json" >"$root/$op-evidence.json"
          done
          target="$root/materialized.enc"; rm -f -- "$target"
          python3 scripts/recovery-production.py descriptor --operation materialize --checksum "$BACKUP_CHECKSUM" --object-ref "$object_ref" --connection-ref "$CONNECTION_REF" >"$root/materialize.json"
          FACTORYRUNNER_RECOVERY_ARTIFACT_ROOT="$root" FACTORYRUNNER_RECOVERY_ARTIFACT_PATH="$target" node --experimental-strip-types _factoryrunner/scripts/recovery-live-object-storage.ts <"$root/materialize.json" >"$root/materialize-evidence.json"
          echo "verified_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Restore, integrity, health y smoke descartables
        id: restore
        env:
          RECOVERY_DISPOSABLE_DATABASE_URL: ${{ secrets.RECOVERY_DISPOSABLE_DATABASE_URL }}
          CONDOR_RECOVERY_ENCRYPTION_PASSPHRASE: ${{ secrets.CONDOR_RECOVERY_ENCRYPTION_PASSPHRASE }}
          CONDOR_RESTORE_EXPECT_TENANT_SLUG: ${{ vars.RECOVERY_RESTORE_EXPECT_TENANT_SLUG }}
          CONDOR_RESTORE_EXPECT_USER_EMAIL: ${{ vars.RECOVERY_RESTORE_EXPECT_USER_EMAIL }}
        run: |
          set -euo pipefail
          root="$HOME/.condor-recovery"
          incident_at="$(date +%s)"
          started_at="$(date +%s)"
          python3 scripts/recovery-production.py decrypt --source materialized.enc --target restored.sql.gz >/dev/null
          DATABASE_URL="$RECOVERY_DISPOSABLE_DATABASE_URL" CONDOR_ALLOW_DESTRUCTIVE_RESTORE=1 sh scripts/verify-backup-restore.sh "$root/restored.sql.gz"
          integrity_ok=true

          app_secret="$(openssl rand -hex 32)"
          DATABASE_URL="$RECOVERY_DISPOSABLE_DATABASE_URL" APP_SECRET="$app_secret" APP_ENV=prod APP_DEBUG=0 RELEASE_SHA="$GITHUB_SHA"             php -S 127.0.0.1:18080 -t public public/index.php >"$root/app-server.log" 2>&1 &
          server_pid=$!
          cleanup_server() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup_server EXIT

          health=""
          for _ in $(seq 1 20); do
            if health="$(curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18080/health 2>/dev/null)"; then
              break
            fi
            sleep 1
          done
          [[ -n "$health" ]] || { cat "$root/app-server.log" >&2; exit 1; }
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok" and d.get("schema_up_to_date") is True' <<<"$health"
          health_ok=true

          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18080/ >/dev/null
          smoke_ok=true
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT
          completed_at="$(date +%s)"

          echo "incident_at=$incident_at" >> "$GITHUB_OUTPUT"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          echo "completed_at=$completed_at" >> "$GITHUB_OUTPUT"
          echo "integrity_ok=$integrity_ok" >> "$GITHUB_OUTPUT"
          echo "health_ok=$health_ok" >> "$GITHUB_OUTPUT"
          echo "smoke_ok=$smoke_ok" >> "$GITHUB_OUTPUT"

      - name: Evaluar RPO/RTO con Factory #330
        env:
          BACKUP_CHECKSUM: ${{ steps.backup.outputs.checksum }}
          BACKUP_CREATED_AT: ${{ steps.backup.outputs.created_at }}
          OFFSITE_VERIFIED_AT: ${{ steps.offsite.outputs.verified_at }}
          INCIDENT_AT: ${{ steps.restore.outputs.incident_at }}
          RESTORE_STARTED_AT: ${{ steps.restore.outputs.started_at }}
          RESTORE_COMPLETED_AT: ${{ steps.restore.outputs.completed_at }}
          HEALTH_OK: ${{ steps.restore.outputs.health_ok }}
          SMOKE_OK: ${{ steps.restore.outputs.smoke_ok }}
          INTEGRITY_OK: ${{ steps.restore.outputs.integrity_ok }}
        run: |
          set -euo pipefail
          root="$HOME/.condor-recovery"
          python3 scripts/recovery-production.py drill-inputs             --run-id "$GITHUB_RUN_ID"             --checksum "$BACKUP_CHECKSUM"             --upload-evidence upload-evidence.json             --verify-evidence verify-evidence.json             --materialize-evidence materialize-evidence.json             --backup-created-at "$BACKUP_CREATED_AT"             --offsite-verified-at "$OFFSITE_VERIFIED_AT"             --incident-at "$INCIDENT_AT"             --started-at "$RESTORE_STARTED_AT"             --completed-at "$RESTORE_COMPLETED_AT"             --health-ok "$HEALTH_OK"             --smoke-ok "$SMOKE_OK"             --integrity-ok "$INTEGRITY_OK"             --rpo-target 900             --rto-target 3600 >"$root/drill-inputs.json"

          PYTHONPATH="$GITHUB_WORKSPACE/_factory" python3 - <<'PY'
          import json
          from pathlib import Path
          from recovery.drill import build_restore_drill_plan, evaluate_restore_drill

          root=Path.home()/".condor-recovery"
          payload=json.loads((root/"drill-inputs.json").read_text(encoding="utf-8"))
          plan=build_restore_drill_plan(payload["manifest"],payload["verified_backup"],payload["target"])
          result=evaluate_restore_drill(payload["manifest"],plan,payload["verified_backup"],payload["evidence"])
          (root/"recovery-plan.json").write_text(json.dumps(plan,sort_keys=True,separators=(",",":")),encoding="utf-8")
          (root/"recovery-report.json").write_text(json.dumps(result,sort_keys=True,separators=(",",":")),encoding="utf-8")
          (root/"protection-latency.txt").write_text(str(payload["protection_latency_seconds"]),encoding="utf-8")
          PY

          python3 - <<'PY' >>"$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          root=Path.home()/".condor-recovery"
          r=json.loads((root/"recovery-report.json").read_text(encoding="utf-8"))
          latency=(root/"protection-latency.txt").read_text(encoding="utf-8")
          print("### Condor DR recovery drill · Factory #330")
          print(f"- Estado canónico: **{r['status']}**")
          print(f"- RPO observado: {r['observed']['rpo_seconds']} s / target {r['observed']['rpo_target_seconds']} s")
          print(f"- RTO observado: {r['observed']['rto_seconds']} s / target {r['observed']['rto_target_seconds']} s")
          print(f"- Latencia de protección (no RPO): {latency} s")
          print(f"- Checks: health={r['checks']['health']}, smoke={r['checks']['smoke']}, integrity={r['checks']['integrity']}")
          print("- Razones: "+(", ".join(r["reasons"]) if r["reasons"] else "ninguna"))
          print("- Evidencia: "+", ".join(r["evidence_refs"]))
          PY

      - name: Preparar evidencia sanitizada del drill
        run: |
          set -euo pipefail
          root="$HOME/.condor-recovery"
          stage="$GITHUB_WORKSPACE/recovery-evidence"
          rm -rf -- "$stage"
          mkdir -p "$stage"
          install -m 600 "$root/recovery-report.json" "$stage/recovery-report.json"
          install -m 600 "$root/upload-evidence.json" "$stage/upload-evidence.json"
          install -m 600 "$root/verify-evidence.json" "$stage/verify-evidence.json"
          install -m 600 "$root/materialize-evidence.json" "$stage/materialize-evidence.json"

      - name: Conservar evidencia auditada del drill
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: condor-recovery-drill-${{ github.run_id }}
          path: ${{ github.workspace }}/recovery-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Aplicar gate canónico del drill
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads((Path.home()/".condor-recovery"/"recovery-report.json").read_text(encoding="utf-8"))
          if report["status"]!="PASSED":
              raise SystemExit("recovery_drill_breached")
          PY
