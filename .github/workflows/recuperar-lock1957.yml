name: Recuperar lock #1957 CAS, OWNER only

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  recover:
    # Job-level: los eventos ajenos con recover skipped no deben cancelar la coordinación V3.
    concurrency:
      group: coordinacion-${{ github.event.issue.number }}
      cancel-in-progress: false
    if: >-
      github.repository == 'pl0n3r/Condor' &&
      github.event.issue.number == 1957 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == '/limpiar-lock-1957' &&
      github.event.comment.user.login == 'pl0n3r' &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == 'pl0n3r' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Recuperar exclusivamente nonce #1957 mediante CAS exacto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: python3 scripts/recuperar_lock1957.py
