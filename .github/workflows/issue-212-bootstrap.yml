name: Bootstrap estático issue 212

on:
  pull_request:
    branches: [main]
    paths:
      - composer.json
      - phpstan.neon.dist
      - rector.php
      - .github/workflows/issue-212-bootstrap.yml

permissions:
  contents: read

concurrency:
  group: issue-212-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Preparar PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none

      - name: Resolver herramientas de análisis
        run: |
          set -euo pipefail
          composer update             phpstan/phpstan             phpstan/phpstan-doctrine             phpstan/phpstan-symfony             rector/rector             --with-all-dependencies             --no-interaction             --prefer-dist             --no-progress
          composer validate --strict

      - name: Generar baseline PHPStan
        run: |
          set -euo pipefail
          vendor/bin/phpstan analyse             --configuration=phpstan.neon.dist             --generate-baseline=phpstan-baseline.neon             --no-progress

      - name: Inspeccionar Rector sin modificar
        run: |
          set +e
          vendor/bin/rector process --dry-run --no-progress-bar > /tmp/rector-output.txt 2>&1
          status=$?
          set -e
          echo "RECTOR_EXIT_STATUS=$status"
          tail -n 200 /tmp/rector-output.txt

      - name: Emitir artefactos reproducibles
        run: |
          set -euo pipefail
          echo "COMPOSER_LOCK_GZ_B64_BEGIN"
          gzip -c composer.lock | base64 --wrap=4000
          echo "COMPOSER_LOCK_GZ_B64_END"
          echo "PHPSTAN_BASELINE_GZ_B64_BEGIN"
          gzip -c phpstan-baseline.neon | base64 --wrap=4000
          echo "PHPSTAN_BASELINE_GZ_B64_END"
