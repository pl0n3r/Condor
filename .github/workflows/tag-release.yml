name: Etiquetar release (V 0.1.0)

# Crea metadata de release sin tocar producción. El tag representa la
# primera llegada de una versión humana a main; corridas posteriores con
# la misma versión son idempotentes. Si una corrida anterior creó el tag
# pero falló antes del GitHub Release, la siguiente completa ese estado.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: condor-tag-release-main
  cancel-in-progress: false

jobs:
  tag:
    name: Asegurar tag y GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Leer versión humana
        id: version
        run: |
          set -euo pipefail
          version="$(php -r "echo (require 'config/version.php')['version'];")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Versión inválida en config/version.php: '$version'"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Asegurar tag anotado
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            existing_type="$(git cat-file -t "refs/tags/$TAG")"
            if [[ "$existing_type" != "tag" ]]; then
              echo "::error::El tag $TAG existente no es anotado."
              exit 1
            fi

            existing_sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
            echo "Tag anotado $TAG ya existe en $existing_sha; no se modifica."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag_object_sha="$(
            gh api               --method POST               "repos/$REPOSITORY/git/tags"               -f tag="$TAG"               -f message="Release $TAG — $TARGET_SHA"               -f object="$TARGET_SHA"               -f type=commit               --jq '.sha'
          )"

          if [[ -z "$tag_object_sha" ]]; then
            echo "::error::GitHub no devolvió el SHA del objeto tag."
            exit 1
          fi

          if ref_response="$(gh api --include --silent --method POST "repos/$REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$tag_object_sha" 2>&1)"; then
            echo "Tag $TAG creado para $TARGET_SHA."
            echo "created=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq '^HTTP/[0-9.]+[[:space:]]+409([[:space:]]|$)' <<<"$ref_response"; then
            race_ref="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG")"
            race_object_type="$(jq -r '.object.type' <<<"$race_ref")"
            race_tag_object_sha="$(jq -r '.object.sha' <<<"$race_ref")"

            if [[ "$race_object_type" != "tag" ]]; then
              echo "::error::La carrera creó $TAG como tag ligero, no anotado."
              exit 1
            fi

            race_target_sha="$(gh api "repos/$REPOSITORY/git/tags/$race_tag_object_sha" --jq '.object.sha')"
            if [[ "$race_target_sha" != "$TARGET_SHA" ]]; then
              echo "::error::La carrera creó $TAG para $race_target_sha, no para $TARGET_SHA."
              exit 1
            fi

            echo "Tag anotado $TAG fue creado concurrentemente para $TARGET_SHA; se continúa."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$ref_response" >&2
            exit 1
          fi

      - name: Asegurar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG ya existe; estado completo."
            exit 0
          fi

          gh release create "$TAG"             --repo "$REPOSITORY"             --verify-tag             --title "Release $TAG (V ${TAG#v})"             --generate-notes

          echo "GitHub Release $TAG publicado."
