name: Bootstrap release assets temporal

on:
  push:
    branches:
      - trabajo/issue-51

permissions:
  contents: write

jobs:
  fijar-release:
    name: Fijar lock PHP y assets compilados
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Preparar PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Actualizar metadata reproducible y compilar assets
        run: |
          set -euo pipefail
          composer update --lock --no-interaction --no-scripts --prefer-dist --no-progress
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build:admin
          test -s public/build/admin.js
          test -s public/build/admin.css

      - name: Fijar resultados directamente en GitHub
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/bootstrap-release-assets.yml
          git add composer.lock .github/workflows/bootstrap-release-assets.yml
          git add -f public/build/admin.js public/build/admin.css
          git commit -m "build: fija lock PHP y assets de release (V 0.1.0)"
          git push origin HEAD:trabajo/issue-51
