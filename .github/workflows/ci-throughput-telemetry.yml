name: Telemetría throughput CI (V 0.1.0)

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: telemetria-ci-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reportar:
    name: Medir throughput
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Elegir último CI completado sin duplicar su evidencia
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          recent="$(gh api "repos/$REPOSITORIO/actions/workflows/ci.yml/runs?per_page=30")"
          source="$(jq -c '[.workflow_runs[]
            | select(.status == "completed")
            | select(.event == "push" or .event == "pull_request")
            | select(.conclusion != null)][0]' <<< "$recent")"
          if [[ "$source" == "null" ]]; then
            echo "Sin CI completado para medir." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          run_id="$(jq -r '.id' <<< "$source")"
          updated="$(jq -r '.updated_at' <<< "$source")"
          updated_epoch="$(date -u -d "$updated" +%s)"
          now_epoch="$(date -u +%s)"
          # Una corrida histórica sin actividad reciente no amerita artefactos nuevos.
          if (( updated_epoch > now_epoch || now_epoch - updated_epoch > 86400 )); then
            echo "Sin CI nuevo en las últimas 24 horas." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          existing="$(gh api "repos/$REPOSITORIO/actions/artifacts?name=ci-throughput-$run_id&per_page=10")"
          if jq -e --arg name "ci-throughput-$run_id"             '[.artifacts[] | select(.name == $name and .expired == false)] | length > 0'             <<< "$existing" >/dev/null; then
            echo "CI $run_id ya cuenta con telemetría; se evita duplicar artifact." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r '"run_id=\(.id)\nsource_sha=\(.head_sha)\nevent=\(.event)\nconclusion=\(.conclusion)\nstarted_at=\(.run_started_at)\nupdated_at=\(.updated_at)"'             <<< "$source" >> "$GITHUB_OUTPUT"
          echo "should_report=true" >> "$GITHUB_OUTPUT"

      - name: Recolectar tiempos y detectar regresión
        if: steps.source.outputs.should_report == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TRUSTED_REF: ${{ github.event.repository.default_branch }}
          SOURCE_EVENT: ${{ steps.source.outputs.event }}
          SOURCE_CONCLUSION: ${{ steps.source.outputs.conclusion }}
          SOURCE_STARTED_AT: ${{ steps.source.outputs.started_at }}
          SOURCE_UPDATED_AT: ${{ steps.source.outputs.updated_at }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh api "repos/$REPOSITORIO/contents/scripts/ci_throughput_report.py?ref=$TRUSTED_REF"             --jq '.content' | base64 --decode > /tmp/ci_throughput_report.py
          gh api --paginate "repos/$REPOSITORIO/actions/runs/$RUN_ID/jobs?per_page=100"             --slurp > artifacts/job-pages.json
          gh api "repos/$REPOSITORIO/actions/runs?per_page=30" > artifacts/recent-runs.json
          : > artifacts/history-jobs.ndjson
          jq -r --argjson current "$RUN_ID" --arg event "$SOURCE_EVENT"             '[.workflow_runs[] | select(.id != $current)
              | select(.name == "CI Condor (V 0.1.0)")
              | select(.event == $event) | select(.conclusion == "success")
              | .id][0:12][]' artifacts/recent-runs.json |
            while read -r history_id; do
              gh api --paginate "repos/$REPOSITORIO/actions/runs/$history_id/jobs?per_page=100"                 --slurp | jq -c --argjson run_id "$history_id"                   '{run_id: $run_id, pages: .}' >> artifacts/history-jobs.ndjson
            done
          jq -s '.' artifacts/history-jobs.ndjson > artifacts/history-jobs.json
          jq -n --slurpfile jobs artifacts/job-pages.json             --slurpfile history artifacts/recent-runs.json             --slurpfile history_jobs artifacts/history-jobs.json             '{jobs: $jobs[0], history: $history[0], history_jobs: $history_jobs[0]}' |
            python3 /tmp/ci_throughput_report.py report               --run-id "$RUN_ID" --source-sha "$SOURCE_SHA"               --event "$SOURCE_EVENT" --conclusion "$SOURCE_CONCLUSION"               --started-at "$SOURCE_STARTED_AT" --updated-at "$SOURCE_UPDATED_AT"               > artifacts/ci-throughput.json
          python3 /tmp/ci_throughput_report.py summary             < artifacts/ci-throughput.json > artifacts/ci-throughput-summary.md
          cat artifacts/ci-throughput-summary.md >> "$GITHUB_STEP_SUMMARY"
          if [[ "$(jq -r '.regression.status' artifacts/ci-throughput.json)" == "regression" ]]; then
            echo "::warning::Regresión significativa del throughput CI; revisar Job Summary."
          fi

      - name: Subir evidencia de throughput
        if: steps.source.outputs.should_report == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-throughput-${{ steps.source.outputs.run_id }}
          path: |
            artifacts/ci-throughput.json
            artifacts/ci-throughput-summary.md
          retention-days: 30
          if-no-files-found: error
