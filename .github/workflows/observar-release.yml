name: Observar release de Condor (V 0.1.0)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión exacta esperada (X.Y.Z)'
        required: true
        type: string
      sha:
        description: 'SHA completo del merge desplegado en Hostinger'
        required: true
        type: string
      tenant_slug:
        description: 'Slug público real de un tenant a comprobar (obligatorio para validar V 0.1.13+)'
        required: false
        type: string
      canonical_storefront:
        description: 'Canonical HTTPS esperado; omitir para usar el slug Condor'
        required: false
        type: string
      migraciones_verificadas:
        description: 'Confirmé migraciones requeridas por esta release'
        required: false
        default: false
        type: boolean
      roles_verificados:
        description: 'Confirmé roles/permisos requeridos por esta release'
        required: false
        default: false
        type: boolean
      comandos_verificados:
        description: 'Confirmé comandos/provisionamiento requeridos por esta release'
        required: false
        default: false
        type: boolean
      configuracion_verificada:
        description: 'Confirmé configuración operativa requerida por esta release'
        required: false
        default: false
        type: boolean
      cache_verificada:
        description: 'Confirmé limpieza/warmup de caché cuando aplica'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: observer-release-${{ github.repository }}
  cancel-in-progress: true

jobs:
  observar:
    name: Validar release y smoke público
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar código confiable de main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validar identidad solicitada contra historial confiable
        env:
          VERSION_ESPERADA: ${{ inputs.version }}
          SHA_ESPERADO: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA_ESPERADO" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::sha debe ser un SHA completo de 40 hexadecimales minúsculos."
            exit 1
          }
          [[ "$VERSION_ESPERADA" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version debe usar formato X.Y.Z."
            exit 1
          }

          git cat-file -e "${SHA_ESPERADO}^{commit}" || {
            echo "::error::El SHA solicitado no existe en el historial local."
            exit 1
          }
          git merge-base --is-ancestor "$SHA_ESPERADO" HEAD || {
            echo "::error::El SHA solicitado no pertenece al historial confiable de main."
            exit 1
          }

          historical_version="$(
            git show "${SHA_ESPERADO}:config/version.php" \
              | grep -oP "'version'\\s*=>\\s*'\\K[^']+"
          )"
          if [[ "$historical_version" != "$VERSION_ESPERADA" ]]; then
            echo "::error::version no coincide con config/version.php del SHA solicitado."
            exit 1
          fi

      - name: Probar evidencia sin tocar producción
        run: |
          python3 -m unittest \
            tests/test_observar_release.py \
            tests/test_release_evidence.py \
            tests/contract/test_release_evidence_contract.py \
            tests/integration/test_release_evidence_integration.py

      - name: Detectar transición y generar manifiesto actual
        id: transicion
        env:
          VERSION_ESPERADA: ${{ inputs.version }}
          SHA_ESPERADO: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "${SHA_ESPERADO}^" "$SHA_ESPERADO" > /tmp/cambios-release.txt

          requiere="$(
            python3 scripts/ci_change_classifier.py \
              --event pull_request \
              --format json \
              < /tmp/cambios-release.txt \
            | python3 -c 'import json, sys; print(str(json.load(sys.stdin)["transicion_release"]).lower())'
          )"
          echo "requerida=$requiere" >> "$GITHUB_OUTPUT"

          python3 scripts/release_evidence.py manifest-explicit \
            --version "$VERSION_ESPERADA" \
            --sha "$SHA_ESPERADO" \
            < /tmp/cambios-release.txt \
            > /tmp/release-current-manifest.json

      - name: Acumular transiciones D-043 pendientes
        id: acumulado
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_ESPERADA: ${{ inputs.version }}
          SHA_ESPERADO: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/1/comments?per_page=100" \
            > /tmp/roadmap-comments.json

          python3 scripts/d043_pending_releases.py \
            --minimum-version 0.1.122 \
            < /tmp/roadmap-comments.json \
            > /tmp/pending-identities.json

          printf '[]\n' > /tmp/pending-manifests.json
          while IFS= read -r identity; do
            version="$(jq -r '.version' <<<"$identity")"
            sha="$(jq -r '.sha' <<<"$identity")"

            if [[ "$version" == "$VERSION_ESPERADA" && "$sha" == "$SHA_ESPERADO" ]]; then
              continue
            fi

            git cat-file -e "${sha}^{commit}" || {
              echo "::error::La release pendiente $version / $sha no existe en Git."
              exit 1
            }

            historical_version="$(
              git show "${sha}:config/version.php" \
                | grep -oP "'version'\\s*=>\\s*'\\K[^']+"
            )"
            if [[ "$historical_version" != "$version" ]]; then
              echo "::error::La identidad histórica $version / $sha no coincide con config/version.php."
              exit 1
            fi

            git diff --name-only "${sha}^" "$sha" > /tmp/historical-changes.txt
            python3 scripts/release_evidence.py manifest-explicit \
              --version "$version" \
              --sha "$sha" \
              < /tmp/historical-changes.txt \
              > /tmp/historical-manifest.json

            jq --slurpfile item /tmp/historical-manifest.json \
              '. + [$item[0]]' \
              /tmp/pending-manifests.json \
              > /tmp/pending-manifests.next.json
            mv /tmp/pending-manifests.next.json /tmp/pending-manifests.json
          done < <(jq -c '.[]' /tmp/pending-identities.json)

          jq -n \
            --slurpfile current /tmp/release-current-manifest.json \
            --slurpfile pending /tmp/pending-manifests.json \
            '{current_manifest:$current[0], pending_manifests:$pending[0]}' \
            | python3 scripts/release_evidence.py accumulate \
            > /tmp/release-manifest.json

          requerida="$(jq -r '.transition.required' /tmp/release-manifest.json)"
          echo "Transición operativa acumulada requerida: $requerida" >> "$GITHUB_STEP_SUMMARY"

      - name: Observar producción en modo solo lectura
        id: smoke
        env:
          VERSION_ESPERADA: ${{ inputs.version }}
          SHA_ESPERADO: ${{ inputs.sha }}
          STOREFRONT_SLUG: ${{ inputs.tenant_slug }}
          STOREFRONT_CANONICAL: ${{ inputs.canonical_storefront }}
        run: |
          set -euo pipefail
          args=(
            --version "$VERSION_ESPERADA"
            --sha "$SHA_ESPERADO"
            --intentos 5
            --intervalo 4
            --timeout 5
          )
          [[ -n "$STOREFRONT_SLUG" ]] && args+=(--tenant-slug "$STOREFRONT_SLUG")
          [[ -n "$STOREFRONT_CANONICAL" ]] && args+=(--canonical-storefront "$STOREFRONT_CANONICAL")
          set +e
          python3 scripts/observar_release.py "${args[@]}" \
            > /tmp/release-observation.json
          estado_observador=$?
          set -e

          if (( estado_observador > 1 )); then
            echo "::error::El observador no pudo producir evidencia válida."
            exit "$estado_observador"
          fi
          echo "estado_cli=$estado_observador" >> "$GITHUB_OUTPUT"

      - name: Consolidar evidencia y checklist de transición
        id: evidencia
        env:
          MIGRACIONES: ${{ inputs.migraciones_verificadas }}
          ROLES: ${{ inputs.roles_verificados }}
          COMANDOS: ${{ inputs.comandos_verificados }}
          CONFIGURACION: ${{ inputs.configuracion_verificada }}
          CACHE: ${{ inputs.cache_verificada }}
        run: |
          set -euo pipefail
          args=(
            finalize
            --markdown
          )

          [[ "$MIGRACIONES" == "true" ]] && args+=(--verified migraciones)
          [[ "$ROLES" == "true" ]] && args+=(--verified roles)
          [[ "$COMANDOS" == "true" ]] && args+=(--verified comandos)
          [[ "$CONFIGURACION" == "true" ]] && args+=(--verified configuracion)
          [[ "$CACHE" == "true" ]] && args+=(--verified cache)

          set +e
          jq -n \
            --slurpfile manifest /tmp/release-manifest.json \
            --slurpfile observation /tmp/release-observation.json \
            '{manifest: $manifest[0], observation: $observation[0]}' \
            | python3 scripts/release_evidence.py "${args[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          estados=("${PIPESTATUS[@]}")
          set -e

          if (( estados[0] != 0 )); then
            exit "${estados[0]}"
          fi
          if (( estados[1] > 1 )); then
            exit "${estados[1]}"
          fi
          if (( estados[2] != 0 )); then
            exit "${estados[2]}"
          fi

          if (( estados[1] == 0 )); then
            echo "validada=true" >> "$GITHUB_OUTPUT"
          else
            echo "validada=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconciliar una sola hoja D-043
        if: ${{ steps.evidencia.outputs.validada == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
            > /tmp/d043-issues.json

          jq -n \
            --slurpfile manifest /tmp/release-manifest.json \
            --slurpfile issues /tmp/d043-issues.json \
            '{manifest:$manifest[0], issues:$issues[0]}' \
            | python3 scripts/d043_reconcile_issue.py \
            > /tmp/d043-action.json

          issue_number="$(jq -r '.action.issue // empty' /tmp/d043-action.json)"
          if [[ -z "$issue_number" ]]; then
            echo "No hay hoja D-043 elegible para reconciliar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          expected_action="$(jq -c '.action' /tmp/d043-action.json)"
          marker="$(jq -r '.action.marker' /tmp/d043-action.json)"
          comment="$(jq -r '.action.comment' /tmp/d043-action.json)"

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
            > /tmp/d043-issues-refetch.json

          jq -n \
            --slurpfile manifest /tmp/release-manifest.json \
            --slurpfile issues /tmp/d043-issues-refetch.json \
            '{manifest:$manifest[0], issues:$issues[0]}' \
            | python3 scripts/d043_reconcile_issue.py \
            > /tmp/d043-action-refetch.json

          current_action="$(jq -c '.action' /tmp/d043-action-refetch.json)"
          if [[ "$current_action" != "$expected_action" ]]; then
            echo "La hoja D-043 cambió durante la reconciliación; no se muta." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" \
            > /tmp/d043-selected.json

          jq -e '
            .state == "open"
            and ([.labels[].name] | index("estado: bloqueado")) != null
            and ([.labels[].name] | index("estado: reservado")) == null
            and ([.labels[].name] | index("estado: en revisión")) == null
            and ([.labels[].name] | index("estado: completado")) == null
          ' /tmp/d043-selected.json >/dev/null || {
            echo "La hoja seleccionada ya no es mutable; no se toca." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          existing_comment="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100" \
            | jq -r --arg marker "$marker" \
              '.[][] | select(.body | contains($marker)) | .id' \
            | sed -n '1p'
          )"

          if [[ -z "$existing_comment" ]]; then
            jq -n --arg body "$comment" '{body:$body}' \
              | gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments" \
                --input - >/dev/null
          fi

          jq '
            [.labels[].name]
            | map(select(. != "estado: bloqueado"))
            | if index("estado: disponible") == null then . + ["estado: disponible"] else . end
            | {labels:.}
          ' /tmp/d043-selected.json \
            | gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/labels" \
              --input - >/dev/null

          echo "Reconciliada una sola hoja D-043: #${issue_number}." >> "$GITHUB_STEP_SUMMARY"

