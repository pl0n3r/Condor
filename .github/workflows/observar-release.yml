name: Observar release de Condor (V 0.1.0)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión exacta esperada (X.Y.Z)'
        required: true
        type: string
      sha:
        description: 'SHA completo del merge desplegado en Hostinger'
        required: true
        type: string

permissions:
  contents: read

jobs:
  observar:
    name: Validar release y smoke público
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Probar observador sin tocar producción
        run: python3 -m unittest tests/test_observar_release.py

      - name: Observar producción en modo solo lectura
        env:
          VERSION_ESPERADA: ${{ inputs.version }}
          SHA_ESPERADO: ${{ inputs.sha }}
        run: |
          python3 scripts/observar_release.py \
            --base-url https://www.condorapp.com.co \
            --version "$VERSION_ESPERADA" \
            --sha "$SHA_ESPERADO" \
            --intentos 5 \
            --intervalo 4 \
            --timeout 5 \
            --summary-file "$GITHUB_STEP_SUMMARY"
