name: Coordinación Factory v1

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, ready_for_review, converted_to_draft, closed]
  issues:
    types: [labeled, closed, reopened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: coordinacion-${{ github.event.issue.number || github.event.pull_request.head.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  comentario:
    name: Procesar comando de coordinación Factory
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.sender.login == github.event.comment.user.login &&
      (
        github.event.comment.body == '/tomar' ||
        github.event.comment.body == '/liberar-forzado' ||
        github.event.comment.body == '/adoptar-contrato-huerfana' ||
        startsWith(github.event.comment.body, '/liberar ') ||
        startsWith(github.event.comment.body, '/transferir ') ||
        startsWith(github.event.comment.body, '/migrar-contrato ') ||
        startsWith(github.event.comment.body, '/renovar-contrato ')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    steps:
      - name: Descargar Factory v1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false
      - name: Procesar comando
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
          ASOCIACION: ${{ github.event.comment.author_association }}
          CUERPO: ${{ github.event.comment.body }}
        run: >-
          python3 .factory/scripts/coordinar_trabajo.py comentario
          --repo "$REPOSITORIO"
          --issue "$ISSUE"
          --actor "$ACTOR"
          --association "$ASOCIACION"
          --body "$CUERPO"

  etiqueta:
    name: Sincronizar reserva Factory
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'estado: reservado'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    steps:
      - name: Descargar Factory v1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false
      - name: Sincronizar reserva
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.sender.login }}
          LABEL: ${{ github.event.label.name }}
        run: >-
          python3 .factory/scripts/coordinar_trabajo.py label-event
          --repo "$REPOSITORIO"
          --issue "$ISSUE"
          --actor "$ACTOR"
          --label "$LABEL"

  pr:
    name: Sincronizar PR Factory
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Descargar Factory v1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false
      - name: Sincronizar PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACCION: ${{ github.event.action }}
        run: >-
          python3 .factory/scripts/coordinar_trabajo.py pr-event
          --repo "$REPOSITORIO"
          --pr "$PR"
          --action "$ACCION"

  issue:
    name: Sincronizar Issue Factory
    if: github.event_name == 'issues' && (github.event.action == 'closed' || github.event.action == 'reopened' || github.event.action == 'edited')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Descargar Factory v1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false
      - name: Sincronizar Issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACCION: ${{ github.event.action }}
        run: >-
          python3 .factory/scripts/coordinar_trabajo.py issue-event
          --repo "$REPOSITORIO"
          --issue "$ISSUE"
          --action "$ACCION"

  sweep:
    name: Marcar reservas recuperables Factory
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - name: Descargar Factory v1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pl0n3r/factory
          ref: v1
          path: .factory
          persist-credentials: false
      - name: Marcar reservas sin progreso verificable
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
        run: python3 .factory/scripts/coordinar_trabajo.py marcar-inactivas --repo "$REPOSITORIO"
