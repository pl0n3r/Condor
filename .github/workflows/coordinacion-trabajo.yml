name: Coordinación multiagente (V 0.1.0)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review, converted_to_draft, closed]
  issues:
    types: [closed, reopened]

permissions:
  contents: read

concurrency:
  group: coordinacion-${{ github.event.issue.number || github.event.pull_request.head.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  comandos:
    name: Procesar reserva de trabajo
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      (
        github.event.comment.body == '/tomar' ||
        startsWith(github.event.comment.body, '/liberar ') ||
        github.event.comment.body == '/liberar-forzado' ||
        startsWith(github.event.comment.body, '/transferir ')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Descargar coordinador canónico
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Ejecutar comando
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
          ASOCIACION: ${{ github.event.comment.author_association }}
          COMANDO: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 scripts/coordinar_trabajo.py comentario             --repo "$REPOSITORIO"             --issue "$ISSUE"             --actor "$ACTOR"             --association "$ASOCIACION"             --body "$COMANDO"

  estado-pr:
    name: Sincronizar estado desde PR
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Descargar coordinador canónico
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Sincronizar estado
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACCION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          python3 scripts/coordinar_trabajo.py pr-event             --repo "$REPOSITORIO"             --pr "$PR"             --action "$ACCION"

  estado-issue:
    name: Limpiar o reabrir reserva
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Descargar coordinador canónico
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Sincronizar estado
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACCION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          python3 scripts/coordinar_trabajo.py issue-event             --repo "$REPOSITORIO"             --issue "$ISSUE"             --action "$ACCION"
