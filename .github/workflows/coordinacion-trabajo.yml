name: Coordinación multiagente (V 0.1.0)

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [ready_for_review, converted_to_draft, closed]
  issues:
    types: [closed, reopened]

permissions:
  contents: read

jobs:
  comandos:
    name: Procesar reserva de trabajo
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      (
        github.event.comment.body == '/tomar' ||
        github.event.comment.body == '/liberar' ||
        github.event.comment.body == '/liberar-forzado'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Descargar coordinador canónico
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Ejecutar comando
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
          ASOCIACION: ${{ github.event.comment.author_association }}
          COMANDO: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          case "$COMANDO" in
            /tomar)
              python3 scripts/coordinar_trabajo.py tomar                 --repo "$REPOSITORIO"                 --issue "$ISSUE"                 --actor "$ACTOR"                 --association "$ASOCIACION"
              ;;
            /liberar)
              python3 scripts/coordinar_trabajo.py liberar                 --repo "$REPOSITORIO"                 --issue "$ISSUE"                 --actor "$ACTOR"                 --association "$ASOCIACION"
              ;;
            /liberar-forzado)
              python3 scripts/coordinar_trabajo.py liberar                 --repo "$REPOSITORIO"                 --issue "$ISSUE"                 --actor "$ACTOR"                 --association "$ASOCIACION"                 --force
              ;;
          esac

  estado-pr:
    name: Sincronizar estado desde PR
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Descargar coordinador canónico
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sincronizar estado
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACCION: ${{ github.event.action }}
        run: |
          python3 scripts/coordinar_trabajo.py pr-event             --repo "$REPOSITORIO"             --pr "$PR"             --action "$ACCION"

  estado-issue:
    name: Limpiar o reabrir reserva
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Descargar coordinador canónico
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sincronizar estado
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACCION: ${{ github.event.action }}
        run: |
          python3 scripts/coordinar_trabajo.py issue-event             --repo "$REPOSITORIO"             --issue "$ISSUE"             --action "$ACCION"
