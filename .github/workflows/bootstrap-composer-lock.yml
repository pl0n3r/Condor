name: Bootstrap Composer Lock temporal

on:
  push:
    branches:
      - trabajo/issue-51

permissions:
  contents: write

jobs:
  composer-lock:
    name: Fijar composer.lock
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Resolver dependencias PHP
        run: composer update --no-interaction --no-scripts --prefer-dist --no-progress

      - name: Validar Composer
        run: composer validate --strict

      - name: Fijar lock y retirar bootstrap temporal
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/bootstrap-composer-lock.yml
          git add composer.lock .github/workflows/bootstrap-composer-lock.yml
          git commit -m "build: fija dependencias PHP del Slice 1 (V 0.1.0)"
          git push origin HEAD:trabajo/issue-51
