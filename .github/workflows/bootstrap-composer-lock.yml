name: Bootstrap Composer Lock temporal

on:
  push:
    branches:
      - trabajo/issue-51

permissions:
  contents: read

jobs:
  composer-lock:
    name: Generar composer.lock
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolver dependencias PHP
        run: composer update --no-interaction --no-scripts --prefer-dist --no-progress

      - name: Validar Composer
        run: composer validate --strict

      - name: Publicar lock temporal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: composer-lock-bootstrap
          path: composer.lock
          retention-days: 1
