name: Observar deploy automático (V 0.1.0)

# Cierra la brecha entre "merge a main" y "alguien recordó correr el
# smoke manual": tras cada push a main, observa producción en modo
# solo lectura (sin escribir ni autenticar) y reporta el estado real
# (NO_OBSERVADO / DEPLOY_OBSERVED / VALIDATED_IN_PRODUCTION) contra
# la versión+SHA esperados.
#
# Cuando la release requiere una transición operativa (migraciones,
# roles, comandos, configuración o caché, según ci_change_classifier)
# nunca se declara VALIDATED_IN_PRODUCTION de forma automática: ese
# estado sigue exigiendo el checklist humano del workflow_dispatch
# manual en observar-release.yml (D-043). Cuando no la requiere, este
# job puede alcanzar VALIDATED_IN_PRODUCTION igual que lo haría un
# humano corriendo el mismo smoke de solo lectura.

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: observer-deploy-${{ github.repository }}-main
  cancel-in-progress: true

jobs:
  observar-deploy:
    name: Observar producción tras push a main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Leer versión humana esperada
        id: version
        run: |
          set -euo pipefail
          version="$(grep -oP "'version'\s*=>\s*'\K[^']+" config/version.php)"
          if [[ -z "$version" ]]; then
            echo "::error::No fue posible leer config/version.php"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Detectar cambios de la release
        id: transicion
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/cambios-release.txt

          requiere="$(
            python3 scripts/ci_change_classifier.py \
              --event push \
              --format json \
              < /tmp/cambios-release.txt \
            | python3 -c 'import json, sys; print(str(json.load(sys.stdin)["transicion_release"]).lower())'
          )"
          echo "requerida=$requiere" >> "$GITHUB_OUTPUT"

      - name: Construir manifiesto canónico actual
        id: manifiesto
        env:
          VERSION_ESPERADA: ${{ steps.version.outputs.version }}
          SHA_ESPERADO: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/release_evidence.py manifest \
            --sha "$SHA_ESPERADO" \
            --expected-version "$VERSION_ESPERADA" \
            < /tmp/cambios-release.txt \
            > /tmp/release-current-manifest.json

      - name: Acumular transiciones D-043 pendientes
        id: acumulado
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_ESPERADA: ${{ steps.version.outputs.version }}
          SHA_ESPERADO: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/1/comments?per_page=100" \
            > /tmp/roadmap-comments.json

          python3 scripts/d043_pending_releases.py \
            --minimum-version 0.1.122 \
            < /tmp/roadmap-comments.json \
            > /tmp/pending-identities.json

          printf '[]\n' > /tmp/pending-manifests.json
          while IFS= read -r identity; do
            version="$(jq -r '.version' <<<"$identity")"
            sha="$(jq -r '.sha' <<<"$identity")"

            if [[ "$version" == "$VERSION_ESPERADA" && "$sha" == "$SHA_ESPERADO" ]]; then
              continue
            fi

            git cat-file -e "${sha}^{commit}" || {
              echo "::error::La release pendiente $version / $sha no existe en Git."
              exit 1
            }

            historical_version="$(
              git show "${sha}:config/version.php" \
                | grep -oP "'version'\\s*=>\\s*'\\K[^']+"
            )"
            if [[ "$historical_version" != "$version" ]]; then
              echo "::error::La identidad histórica $version / $sha no coincide con config/version.php."
              exit 1
            fi

            git diff --name-only "${sha}^" "$sha" > /tmp/historical-changes.txt
            python3 scripts/release_evidence.py manifest-explicit \
              --version "$version" \
              --sha "$sha" \
              < /tmp/historical-changes.txt \
              > /tmp/historical-manifest.json

            jq --slurpfile item /tmp/historical-manifest.json \
              '. + [$item[0]]' \
              /tmp/pending-manifests.json \
              > /tmp/pending-manifests.next.json
            mv /tmp/pending-manifests.next.json /tmp/pending-manifests.json
          done < <(jq -c '.[]' /tmp/pending-identities.json)

          jq -n \
            --slurpfile current /tmp/release-current-manifest.json \
            --slurpfile pending /tmp/pending-manifests.json \
            '{current_manifest:$current[0], pending_manifests:$pending[0]}' \
            | python3 scripts/release_evidence.py accumulate \
            > /tmp/release-manifest.json

          requerida="$(jq -r '.transition.required' /tmp/release-manifest.json)"
          echo "requerida=$requerida" >> "$GITHUB_OUTPUT"

      - name: Observar producción en modo solo lectura
        id: smoke
        env:
          VERSION_ESPERADA: ${{ steps.version.outputs.version }}
          SHA_ESPERADO: ${{ github.sha }}
          STOREFRONT_SLUG: ${{ vars.STOREFRONT_SLUG }}
          STOREFRONT_CANONICAL: ${{ vars.STOREFRONT_CANONICAL }}
          TRANSICION_REQUERIDA: ${{ steps.acumulado.outputs.requerida }}
        run: |
          set -euo pipefail
          args=(
            --version "$VERSION_ESPERADA"
            --sha "$SHA_ESPERADO"
            --intentos 3
            --intervalo 10
            --timeout 5
            --espera-deploy 1200
            --intervalo-deploy 30
          )
          [[ -n "$STOREFRONT_SLUG" ]] &&
            args+=(--tenant-slug "$STOREFRONT_SLUG")
          [[ -n "$STOREFRONT_CANONICAL" ]] &&
            args+=(--canonical-storefront "$STOREFRONT_CANONICAL")

          # Nunca se pasa --transicion-verificada aquí: esta corrida es
          # automática, sin confirmación humana. Si la release requiere
          # transición operativa, el estado queda topado en
          # DEPLOY_OBSERVED como máximo, nunca VALIDATED_IN_PRODUCTION.
          if [[ "$TRANSICION_REQUERIDA" == "true" ]]; then
            args+=(--transicion-requerida)
          fi

          set +e
          python3 scripts/observar_release.py "${args[@]}" > /tmp/release-observation.json
          estado_cli=$?
          set -e

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("/tmp/release-observation.json", encoding="utf-8") as evidencia:
              resultado = json.load(evidencia)

          lineas = [
              "### Observación de deploy (automática, sin mutar producción)",
              "",
              f"- Estado: **{resultado['estado']}**",
              f"- Versión esperada: `{resultado['version_esperada']}`",
              f"- SHA esperado: `{resultado['sha_esperado']}`",
              "",
              "| Comprobación | Resultado | Detalle |",
              "| --- | --- | --- |",
          ]
          for nombre, item in resultado["comprobaciones"].items():
              icono = "OK" if item["ok"] else "FALLO"
              lineas.append(f"| `{nombre}` | {icono} | {item['detalle']} |")

          print("\n".join(lineas))
          PY

          estado="$(python3 -c 'import json; print(json.load(open("/tmp/release-observation.json"))["estado"])')"
          echo "estado=$estado" >> "$GITHUB_OUTPUT"
          echo "estado_cli=$estado_cli" >> "$GITHUB_OUTPUT"

          if (( estado_cli > 1 )); then
            echo "::error::La observación automática terminó sin validar producción; revise la evidencia publicada."
            exit "$estado_cli"
          fi

      - name: Publicar tarjeta humana D-043 pendiente
        if: ${{ steps.smoke.outputs.estado == 'DEPLOY_OBSERVED' && steps.acumulado.outputs.requerida == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STOREFRONT_SLUG: ${{ vars.STOREFRONT_SLUG }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY")
          [[ -n "$STOREFRONT_SLUG" ]] &&
            args+=(--tenant-slug "$STOREFRONT_SLUG")

          python3 scripts/d043_validation_card.py "${args[@]}" \
            < /tmp/release-manifest.json \
            > /tmp/d043-card.md

          marker="$(grep -m1 '^<!-- condor-d043-validation-card ' /tmp/d043-card.md)"
          if [[ -z "$marker" ]]; then
            echo "::error::La tarjeta D-043 no contiene marker canónico."
            exit 1
          fi

          comment_id="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/issues/1/comments?per_page=100" \
            | jq -r --arg marker "$marker" \
              '.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($marker))) | .id' \
            | sed -n '1p'
          )"

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F body=@/tmp/d043-card.md \
              >/dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/1/comments" \
              -F body=@/tmp/d043-card.md \
              >/dev/null
          fi

      - name: Registrar estado observado en el roadmap
        if: ${{ always() && steps.smoke.outputs.estado != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_ESPERADA: ${{ steps.version.outputs.version }}
          SHA_ESPERADO: ${{ github.sha }}
          ESTADO: ${{ steps.smoke.outputs.estado }}
        run: |
          set -euo pipefail
          cuerpo="$(python3 -c 'import json, sys; sys.path.insert(0, "scripts"); from observar_release import comentario_roadmap; print(comentario_roadmap(json.load(open("/tmp/release-observation.json"))))')"
          gh issue comment 1 --repo "${{ github.repository }}" --body "$cuerpo"
