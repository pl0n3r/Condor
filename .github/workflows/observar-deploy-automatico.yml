name: Observar deploy automático (V 0.1.0)

# Cierra la brecha entre "merge a main" y "alguien recordó correr el
# smoke manual": tras cada push a main, observa producción en modo
# solo lectura (sin escribir ni autenticar) y reporta el estado real
# (NO_OBSERVADO / DEPLOY_OBSERVED / VALIDATED_IN_PRODUCTION) contra
# la versión+SHA esperados.
#
# Cuando la release requiere una transición operativa (migraciones,
# roles, comandos, configuración o caché, según ci_change_classifier)
# nunca se declara VALIDATED_IN_PRODUCTION de forma automática: ese
# estado sigue exigiendo el checklist humano del workflow_dispatch
# manual en observar-release.yml (D-043). Cuando no la requiere, este
# job puede alcanzar VALIDATED_IN_PRODUCTION igual que lo haría un
# humano corriendo el mismo smoke de solo lectura.

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: observer-deploy-${{ github.repository }}-main
  cancel-in-progress: true

jobs:
  observar-deploy:
    name: Observar producción tras push a main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Leer versión humana esperada
        id: version
        run: |
          set -euo pipefail
          version="$(grep -oP "'version'\s*=>\s*'\K[^']+" config/version.php)"
          if [[ -z "$version" ]]; then
            echo "::error::No fue posible leer config/version.php"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          previous_sha="${{ github.event.before }}"
          previous_version=""
          if [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]] && [[ "$previous_sha" != "0000000000000000000000000000000000000000" ]]; then
            previous_version="$(
              git show "${previous_sha}:config/version.php" 2>/dev/null                 | grep -oP "'version'\s*=>\s*'\K[^']+"                 || true
            )"
          fi
          echo "previous_version=$previous_version" >> "$GITHUB_OUTPUT"

          bootstrap_previous=false
          if [[ -n "$previous_version" && "$previous_version" != "$version" ]]; then
            bootstrap_previous=true
          fi
          echo "bootstrap_previous=$bootstrap_previous" >> "$GITHUB_OUTPUT"

          bootstrap_only=false
          if [[ -n "$previous_version" && "$previous_version" == "$version" ]]; then
            git diff --name-only "$previous_sha" "${{ github.sha }}" > /tmp/current-push-paths.txt
            if python3 - <<'PY'
          from pathlib import Path
          allowed = {
              ".github/workflows/observar-deploy-automatico.yml",
              "scripts/release_evidence.py",
              "tests/test_d043_dev_auto_validation.py",
              "docs/d043-validacion-desarrollo.md",
          }
          paths = {
              line.strip()
              for line in Path("/tmp/current-push-paths.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          raise SystemExit(0 if paths and paths.issubset(allowed) else 1)
          PY
            then
              bootstrap_only=true
            fi
          fi
          echo "bootstrap_only=$bootstrap_only" >> "$GITHUB_OUTPUT"

      - name: Resolver fase D-043 desde la puerta canónica
        id: fase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/389" > /tmp/d043-phase-gate.json
          phase="$(
            jq -r '
              if .state == "open"
                 and ([.labels[].name] | index("estado: bloqueado")) != null
              then "construccion"
              else "desconocida"
              end
            ' /tmp/d043-phase-gate.json
          )"
          echo "value=$phase" >> "$GITHUB_OUTPUT"
          echo "Fase D-043 resuelta desde #389: $phase" >> "$GITHUB_STEP_SUMMARY"

      - name: Auto-validar baseline D-043 previa en construcción
        if: ${{ steps.version.outputs.bootstrap_only == 'true' || steps.version.outputs.bootstrap_previous == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FASE_CONDOR: ${{ steps.fase.outputs.value }}
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous_version }}
          PREVIOUS_SHA: ${{ github.event.before }}
          STOREFRONT_SLUG: ${{ vars.STOREFRONT_SLUG }}
          STOREFRONT_CANONICAL: ${{ vars.STOREFRONT_CANONICAL }}
        run: |
          set -euo pipefail

          gh api --paginate --slurp             "repos/${GITHUB_REPOSITORY}/issues/1/comments?per_page=100"             > /tmp/d043-bootstrap-comments.json

          python3 scripts/d043_pending_releases.py             --minimum-version 0.1.122             < /tmp/d043-bootstrap-comments.json             > /tmp/d043-bootstrap-pending.json

          if ! jq -e             --arg version "$PREVIOUS_VERSION"             --arg sha "$PREVIOUS_SHA"             '.[] | select(.version == $version and .sha == $sha)'             /tmp/d043-bootstrap-pending.json >/dev/null; then
            echo "La baseline previa no está pendiente en D-043; no se auto-valida." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git diff --name-only "${PREVIOUS_SHA}^" "$PREVIOUS_SHA" > /tmp/d043-bootstrap-current-paths.txt
          cp /tmp/d043-bootstrap-current-paths.txt /tmp/d043-bootstrap-all-paths.txt
          python3 scripts/release_evidence.py manifest-explicit             --version "$PREVIOUS_VERSION"             --sha "$PREVIOUS_SHA"             < /tmp/d043-bootstrap-current-paths.txt             > /tmp/d043-bootstrap-current-manifest.json

          printf '[]\n' > /tmp/d043-bootstrap-older-manifests.json
          while IFS= read -r identity; do
            version="$(jq -r '.version' <<<"$identity")"
            sha="$(jq -r '.sha' <<<"$identity")"
            if [[ "$version" == "$PREVIOUS_VERSION" && "$sha" == "$PREVIOUS_SHA" ]]; then
              continue
            fi
            if ! python3 - "$version" "$PREVIOUS_VERSION" <<'PY'
          import sys
          def key(value): return tuple(map(int, value.split(".")))
          raise SystemExit(0 if key(sys.argv[1]) < key(sys.argv[2]) else 1)
          PY
            then
              echo "Baseline D-043 ambigua por identidad no anterior; se mantiene fail-closed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git cat-file -e "${sha}^{commit}" || exit 0
            historical_version="$(
              git show "${sha}:config/version.php"                 | grep -oP "'version'\\s*=>\\s*'\\K[^']+"
            )"
            [[ "$historical_version" == "$version" ]] || exit 0
            git diff --name-only "${sha}^" "$sha" > /tmp/d043-bootstrap-historical-paths.txt
            cat /tmp/d043-bootstrap-historical-paths.txt >> /tmp/d043-bootstrap-all-paths.txt
            python3 scripts/release_evidence.py manifest-explicit               --version "$version"               --sha "$sha"               < /tmp/d043-bootstrap-historical-paths.txt               > /tmp/d043-bootstrap-historical-manifest.json
            jq --slurpfile item /tmp/d043-bootstrap-historical-manifest.json               '. + [$item[0]]' /tmp/d043-bootstrap-older-manifests.json               > /tmp/d043-bootstrap-next.json
            mv /tmp/d043-bootstrap-next.json /tmp/d043-bootstrap-older-manifests.json
          done < <(jq -c '.[]' /tmp/d043-bootstrap-pending.json)

          jq -n             --slurpfile current /tmp/d043-bootstrap-current-manifest.json             --slurpfile pending /tmp/d043-bootstrap-older-manifests.json             '{current_manifest:$current[0],pending_manifests:$pending[0]}'             | python3 scripts/release_evidence.py accumulate             > /tmp/d043-bootstrap-manifest.json

          args=(
            --version "$PREVIOUS_VERSION"
            --sha "$PREVIOUS_SHA"
            --intentos 2
            --intervalo 2
            --timeout 5
          )
          [[ -n "$STOREFRONT_SLUG" ]] && args+=(--tenant-slug "$STOREFRONT_SLUG")
          [[ -n "$STOREFRONT_CANONICAL" ]] && args+=(--canonical-storefront "$STOREFRONT_CANONICAL")
          if [[ "$(jq -r '.transition.required' /tmp/d043-bootstrap-manifest.json)" == "true" ]]; then
            args+=(--transicion-requerida)
          fi

          set +e
          python3 scripts/observar_release.py "${args[@]}" > /tmp/d043-bootstrap-observation.json
          observer_rc=$?
          set -e
          if (( observer_rc > 1 )); then
            echo "Baseline previa ya no es observable con evidencia suficiente; fail-closed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          PREVIOUS_VERSION="$PREVIOUS_VERSION" PREVIOUS_SHA="$PREVIOUS_SHA" python3 - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, "scripts")
          from observar_release import (
              DOMINIO_PRODUCCION,
              ObservacionError,
              obtener,
              validar_post_deploy_status,
          )
          result = {
              "ok": False,
              "phase": "unknown",
              "result": "unknown",
              "detalle": "Evidencia post-deploy no concluyente.",
          }
          try:
              tipo, cuerpo = obtener(DOMINIO_PRODUCCION, "/post-deploy-status.php", 5)
              detalle = validar_post_deploy_status(
                  tipo, cuerpo, os.environ["PREVIOUS_VERSION"], os.environ["PREVIOUS_SHA"]
              )
              payload = json.loads(cuerpo.decode("utf-8"))
              post = payload.get("post_deploy", {})
              result = {
                  "ok": post.get("phase") == "complete" and post.get("result") == "success",
                  "phase": post.get("phase", "unknown"),
                  "result": post.get("result", "unknown"),
                  "detalle": detalle,
              }
          except (ObservacionError, OSError, ValueError):
              pass
          with open("/tmp/d043-bootstrap-post.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, ensure_ascii=False, sort_keys=True)
          PY

          jq --slurpfile post /tmp/d043-bootstrap-post.json             '.comprobaciones.post_deploy_status=$post[0]'             /tmp/d043-bootstrap-observation.json             > /tmp/d043-bootstrap-observation-dev.json

          printf '%s\n' "$PREVIOUS_SHA" > /tmp/d043-bootstrap-source-shas.txt
          jq -r '.[].sha' /tmp/d043-bootstrap-pending.json >> /tmp/d043-bootstrap-source-shas.txt
          sort -u /tmp/d043-bootstrap-source-shas.txt -o /tmp/d043-bootstrap-source-shas.txt
          python3 scripts/release_evidence.py development-migration-sources \
            < /tmp/d043-bootstrap-source-shas.txt \
            > /tmp/d043-bootstrap-migration-sources.json

          jq -n --rawfile paths /tmp/d043-bootstrap-all-paths.txt --slurpfile migrations /tmp/d043-bootstrap-migration-sources.json '{changed_paths:($paths|split("\n")|map(select(length>0))),migration_sources:$migrations[0]}' | python3 scripts/release_evidence.py development-safety --json > /tmp/d043-bootstrap-safety.json

          dev_args=(development-auto --phase "$FASE_CONDOR" --migration-class "$(jq -r '.migration_class' /tmp/d043-bootstrap-safety.json)")
          [[ "$(jq -r '.comandos' /tmp/d043-bootstrap-safety.json)" == "true" ]]             && dev_args+=(--commands-safe)
          [[ "$(jq -r '.migraciones' /tmp/d043-bootstrap-safety.json)" == "true" ]]             && dev_args+=(--migrations-safe)

          set +e
          jq -n             --slurpfile manifest /tmp/d043-bootstrap-manifest.json             --slurpfile observation /tmp/d043-bootstrap-observation-dev.json             '{manifest:$manifest[0],observation:$observation[0]}'             | python3 scripts/release_evidence.py "${dev_args[@]}"             > /tmp/d043-bootstrap-dev-evidence.json
          dev_rc=$?
          set -e
          if (( dev_rc != 0 )); then
            echo "Baseline previa no cumple auto-validación de desarrollo; permanece pendiente." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 scripts/release_evidence.py development-comment             < /tmp/d043-bootstrap-dev-evidence.json             > /tmp/d043-bootstrap-comment.md
          marker="$(head -n1 /tmp/d043-bootstrap-comment.md)"

          for issue_number in 1 389; do
            comment_id="$(
              gh api --paginate --slurp                 "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100"               | jq -r --arg marker "$marker"                 '.[][] | select(.user.login=="github-actions[bot]" and (.body|contains($marker))) | .id'               | sed -n '1p'
            )"
            if [[ -n "$comment_id" ]]; then
              gh api --method PATCH                 "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}"                 -F body=@/tmp/d043-bootstrap-comment.md >/dev/null
            else
              gh api --method POST                 "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments"                 -F body=@/tmp/d043-bootstrap-comment.md >/dev/null
            fi
          done

          echo "Baseline D-043 previa auto-validada con evidencia exacta; registrada también en #389." >> "$GITHUB_STEP_SUMMARY"

      - name: Detectar cambios de la release
        if: ${{ steps.version.outputs.bootstrap_only != 'true' }}
        id: transicion
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/cambios-release.txt

          requiere="$(
            python3 scripts/ci_change_classifier.py \
              --event push \
              --format json \
              < /tmp/cambios-release.txt \
            | python3 -c 'import json, sys; print(str(json.load(sys.stdin)["transicion_release"]).lower())'
          )"
          echo "requerida=$requiere" >> "$GITHUB_OUTPUT"

      - name: Construir manifiesto canónico actual
        if: ${{ steps.version.outputs.bootstrap_only != 'true' }}
        id: manifiesto
        env:
          VERSION_ESPERADA: ${{ steps.version.outputs.version }}
          SHA_ESPERADO: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/release_evidence.py manifest \
            --sha "$SHA_ESPERADO" \
            --expected-version "$VERSION_ESPERADA" \
            < /tmp/cambios-release.txt \
            > /tmp/release-current-manifest.json

      - name: Acumular transiciones D-043 pendientes
        if: ${{ steps.version.outputs.bootstrap_only != 'true' }}
        id: acumulado
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_ESPERADA: ${{ steps.version.outputs.version }}
          SHA_ESPERADO: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/1/comments?per_page=100" \
            > /tmp/roadmap-comments.json

          python3 scripts/d043_pending_releases.py \
            --minimum-version 0.1.122 \
            < /tmp/roadmap-comments.json \
            > /tmp/pending-identities.json

          printf '[]\n' > /tmp/pending-manifests.json
          cp /tmp/cambios-release.txt /tmp/d043-all-paths.txt
          while IFS= read -r identity; do
            version="$(jq -r '.version' <<<"$identity")"
            sha="$(jq -r '.sha' <<<"$identity")"

            if [[ "$version" == "$VERSION_ESPERADA" && "$sha" == "$SHA_ESPERADO" ]]; then
              continue
            fi

            git cat-file -e "${sha}^{commit}" || {
              echo "::error::La release pendiente $version / $sha no existe en Git."
              exit 1
            }

            historical_version="$(
              git show "${sha}:config/version.php" \
                | grep -oP "'version'\\s*=>\\s*'\\K[^']+"
            )"
            if [[ "$historical_version" != "$version" ]]; then
              echo "::error::La identidad histórica $version / $sha no coincide con config/version.php."
              exit 1
            fi

            git diff --name-only "${sha}^" "$sha" > /tmp/historical-changes.txt
            cat /tmp/historical-changes.txt >> /tmp/d043-all-paths.txt
            python3 scripts/release_evidence.py manifest-explicit \
              --version "$version" \
              --sha "$sha" \
              < /tmp/historical-changes.txt \
              > /tmp/historical-manifest.json

            jq --slurpfile item /tmp/historical-manifest.json \
              '. + [$item[0]]' \
              /tmp/pending-manifests.json \
              > /tmp/pending-manifests.next.json
            mv /tmp/pending-manifests.next.json /tmp/pending-manifests.json
          done < <(jq -c '.[]' /tmp/pending-identities.json)

          jq -n \
            --slurpfile current /tmp/release-current-manifest.json \
            --slurpfile pending /tmp/pending-manifests.json \
            '{current_manifest:$current[0], pending_manifests:$pending[0]}' \
            | python3 scripts/release_evidence.py accumulate \
            > /tmp/release-manifest.json

          requerida="$(jq -r '.transition.required' /tmp/release-manifest.json)"
          echo "requerida=$requerida" >> "$GITHUB_OUTPUT"

      - name: Observar producción en modo solo lectura
        if: ${{ steps.version.outputs.bootstrap_only != 'true' }}
        id: smoke
        env:
          VERSION_ESPERADA: ${{ steps.version.outputs.version }}
          SHA_ESPERADO: ${{ github.sha }}
          STOREFRONT_SLUG: ${{ vars.STOREFRONT_SLUG }}
          STOREFRONT_CANONICAL: ${{ vars.STOREFRONT_CANONICAL }}
          TRANSICION_REQUERIDA: ${{ steps.acumulado.outputs.requerida }}
        run: |
          set -euo pipefail
          args=(
            --version "$VERSION_ESPERADA"
            --sha "$SHA_ESPERADO"
            --intentos 3
            --intervalo 10
            --timeout 5
            --espera-deploy 1200
            --intervalo-deploy 30
          )
          [[ -n "$STOREFRONT_SLUG" ]] &&
            args+=(--tenant-slug "$STOREFRONT_SLUG")
          [[ -n "$STOREFRONT_CANONICAL" ]] &&
            args+=(--canonical-storefront "$STOREFRONT_CANONICAL")

          # Nunca se pasa --transicion-verificada aquí: esta corrida es
          # automática, sin confirmación humana. Si la release requiere
          # transición operativa, el estado queda topado en
          # DEPLOY_OBSERVED como máximo, nunca VALIDATED_IN_PRODUCTION.
          if [[ "$TRANSICION_REQUERIDA" == "true" ]]; then
            args+=(--transicion-requerida)
          fi

          set +e
          python3 scripts/observar_release.py "${args[@]}" > /tmp/release-observation.json
          estado_cli=$?
          set -e

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("/tmp/release-observation.json", encoding="utf-8") as evidencia:
              resultado = json.load(evidencia)

          lineas = [
              "### Observación de deploy (automática, sin mutar producción)",
              "",
              f"- Estado: **{resultado['estado']}**",
              f"- Versión esperada: `{resultado['version_esperada']}`",
              f"- SHA esperado: `{resultado['sha_esperado']}`",
              "",
              "| Comprobación | Resultado | Detalle |",
              "| --- | --- | --- |",
          ]
          for nombre, item in resultado["comprobaciones"].items():
              icono = "OK" if item["ok"] else "FALLO"
              lineas.append(f"| `{nombre}` | {icono} | {item['detalle']} |")

          print("\n".join(lineas))
          PY

          estado="$(python3 -c 'import json; print(json.load(open("/tmp/release-observation.json"))["estado"])')"
          echo "estado=$estado" >> "$GITHUB_OUTPUT"
          echo "estado_cli=$estado_cli" >> "$GITHUB_OUTPUT"

          if (( estado_cli > 1 )); then
            echo "::error::La observación automática terminó sin validar producción; revise la evidencia publicada."
            exit "$estado_cli"
          fi

      - name: Capturar evidencia post-deploy para D-043 desarrollo
        id: post_deploy_dev
        if: ${{ steps.version.outputs.bootstrap_only != 'true' && steps.smoke.outputs.estado == 'DEPLOY_OBSERVED' && steps.acumulado.outputs.requerida == 'true' }}
        env:
          VERSION_ESPERADA: ${{ steps.version.outputs.version }}
          SHA_ESPERADO: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, "scripts")
          from observar_release import (
              DOMINIO_PRODUCCION,
              ObservacionError,
              obtener,
              validar_post_deploy_status,
          )
          result = {
              "ok": False,
              "phase": "unknown",
              "result": "unknown",
              "detalle": "Evidencia post-deploy no concluyente.",
          }
          try:
              tipo, cuerpo = obtener(DOMINIO_PRODUCCION, "/post-deploy-status.php", 5)
              detalle = validar_post_deploy_status(
                  tipo, cuerpo, os.environ["VERSION_ESPERADA"], os.environ["SHA_ESPERADO"]
              )
              payload = json.loads(cuerpo.decode("utf-8"))
              post = payload.get("post_deploy", {})
              result = {
                  "ok": post.get("phase") == "complete" and post.get("result") == "success",
                  "phase": post.get("phase", "unknown"),
                  "result": post.get("result", "unknown"),
                  "detalle": detalle,
              }
          except (ObservacionError, OSError, ValueError):
              pass
          with open("/tmp/d043-dev-post.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, ensure_ascii=False, sort_keys=True)
          PY

      - name: Evaluar auto-validación D-043 de desarrollo
        id: auto_dev
        if: ${{ steps.version.outputs.bootstrap_only != 'true' && steps.smoke.outputs.estado == 'DEPLOY_OBSERVED' && steps.acumulado.outputs.requerida == 'true' }}
        env:
          FASE_CONDOR: ${{ steps.fase.outputs.value }}
        run: |
          set -euo pipefail
          jq --slurpfile post /tmp/d043-dev-post.json             '.comprobaciones.post_deploy_status=$post[0]'             /tmp/release-observation.json             > /tmp/d043-dev-observation.json

          printf '%s\n' "$GITHUB_SHA" > /tmp/d043-source-shas.txt
          jq -r '.[].sha' /tmp/pending-identities.json >> /tmp/d043-source-shas.txt
          sort -u /tmp/d043-source-shas.txt -o /tmp/d043-source-shas.txt
          python3 scripts/release_evidence.py development-migration-sources \
            < /tmp/d043-source-shas.txt \
            > /tmp/d043-migration-sources.json

          jq -n --rawfile paths /tmp/d043-all-paths.txt --slurpfile migrations /tmp/d043-migration-sources.json '{changed_paths:($paths|split("\n")|map(select(length>0))),migration_sources:$migrations[0]}' | python3 scripts/release_evidence.py development-safety --json > /tmp/d043-dev-safety.json

          args=(development-auto --phase "$FASE_CONDOR" --migration-class "$(jq -r '.migration_class' /tmp/d043-dev-safety.json)")
          [[ "$(jq -r '.comandos' /tmp/d043-dev-safety.json)" == "true" ]]             && args+=(--commands-safe)
          [[ "$(jq -r '.migraciones' /tmp/d043-dev-safety.json)" == "true" ]]             && args+=(--migrations-safe)

          set +e
          jq -n             --slurpfile manifest /tmp/release-manifest.json             --slurpfile observation /tmp/d043-dev-observation.json             '{manifest:$manifest[0],observation:$observation[0]}'             | python3 scripts/release_evidence.py "${args[@]}"             > /tmp/d043-dev-evidence.json
          rc=$?
          set -e
          if (( rc == 0 )); then
            echo "validada=true" >> "$GITHUB_OUTPUT"
          elif (( rc == 1 )); then
            echo "validada=false" >> "$GITHUB_OUTPUT"
          else
            exit "$rc"
          fi

      - name: Registrar auto-validación D-043 de desarrollo
        if: ${{ steps.auto_dev.outputs.validada == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release_evidence.py development-comment             < /tmp/d043-dev-evidence.json             > /tmp/d043-dev-comment.md
          marker="$(head -n1 /tmp/d043-dev-comment.md)"
          for issue_number in 1 389; do
            comment_id="$(
              gh api --paginate --slurp                 "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100"               | jq -r --arg marker "$marker"                 '.[][] | select(.user.login=="github-actions[bot]" and (.body|contains($marker))) | .id'               | sed -n '1p'
            )"
            if [[ -n "$comment_id" ]]; then
              gh api --method PATCH                 "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}"                 -F body=@/tmp/d043-dev-comment.md >/dev/null
            else
              gh api --method POST                 "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments"                 -F body=@/tmp/d043-dev-comment.md >/dev/null
            fi
          done

      - name: Publicar tarjeta humana D-043 pendiente
        if: ${{ steps.version.outputs.bootstrap_only != 'true' && steps.smoke.outputs.estado == 'DEPLOY_OBSERVED' && steps.acumulado.outputs.requerida == 'true' && steps.auto_dev.outputs.validada != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STOREFRONT_SLUG: ${{ vars.STOREFRONT_SLUG }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY")
          [[ -n "$STOREFRONT_SLUG" ]] &&
            args+=(--tenant-slug "$STOREFRONT_SLUG")

          python3 scripts/d043_validation_card.py "${args[@]}" \
            < /tmp/release-manifest.json \
            > /tmp/d043-card.md

          marker="$(grep -m1 '^<!-- condor-d043-validation-card ' /tmp/d043-card.md)"
          if [[ -z "$marker" ]]; then
            echo "::error::La tarjeta D-043 no contiene marker canónico."
            exit 1
          fi

          comment_id="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/issues/1/comments?per_page=100" \
            | jq -r --arg marker "$marker" \
              '.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($marker))) | .id' \
            | sed -n '1p'
          )"

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F body=@/tmp/d043-card.md \
              >/dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/1/comments" \
              -F body=@/tmp/d043-card.md \
              >/dev/null
          fi

      - name: Registrar estado observado en el roadmap
        if: ${{ always() && steps.version.outputs.bootstrap_only != 'true' && steps.smoke.outputs.estado != '' && steps.auto_dev.outputs.validada != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_ESPERADA: ${{ steps.version.outputs.version }}
          SHA_ESPERADO: ${{ github.sha }}
          ESTADO: ${{ steps.smoke.outputs.estado }}
        run: |
          set -euo pipefail
          cuerpo="$(python3 -c 'import json, sys; sys.path.insert(0, "scripts"); from observar_release import comentario_roadmap; print(comentario_roadmap(json.load(open("/tmp/release-observation.json"))))')"
          gh issue comment 1 --repo "${{ github.repository }}" --body "$cuerpo"
