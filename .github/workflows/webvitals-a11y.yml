name: Web Vitals y accesibilidad E2E · #1982

on:
  pull_request:
    branches: [main]
    paths:
      - tests/e2e/webvitals-a11y.spec.mjs
      - .github/workflows/webvitals-a11y.yml
  push:
    branches: [main]
    paths:
      - tests/e2e/webvitals-a11y.spec.mjs
      - .github/workflows/webvitals-a11y.yml

permissions:
  contents: read

concurrency:
  group: webvitals-a11y-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  webvitals-a11y:
    name: Web Vitals + axe · Chromium y WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: condor_webvitals_ci
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      APP_DEBUG: '0'
      DATABASE_URL: mysql://root@127.0.0.1:3306/condor_webvitals_ci?serverVersion=mariadb-11.4.0&charset=utf8mb4
      VITALS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
      E2E_EMAIL: owner-e2e@example.test
      E2E_PLATFORM_EMAIL: owner-e2e-platform@example.test
    steps:
      - name: Checkout del SHA evaluado (no merge sintético)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verificar identidad exacta del checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VITALS_HEAD_SHA"
          [[ "$VITALS_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Preparar PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none

      - name: Preparar Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Generar secreto local y usuario sintético
        shell: bash
        run: |
          set -euo pipefail
          app_secret="$(openssl rand -hex 32)"
          e2e_password="$(openssl rand -hex 32)"
          echo "::add-mask::$app_secret"
          echo "::add-mask::$e2e_password"
          echo "APP_SECRET=$app_secret" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$e2e_password" >> "$GITHUB_ENV"
          echo "CONDOR_OWNER_PASSWORD=$e2e_password" >> "$GITHUB_ENV"
          echo "CONDOR_PLATFORM_OWNER_PASSWORD=$e2e_password" >> "$GITHUB_ENV"

      - name: Instalar dependencias y axe-core fijado
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_retry.py --attempts 3 --base-delay 3 \
            --label "npm ci Web Vitals" -- npm ci --ignore-scripts --no-audit --no-fund
          python3 scripts/ci_retry.py --attempts 3 --base-delay 3 \
            --label "composer install Web Vitals" -- composer install --no-interaction --prefer-dist --no-progress
          # Única dependencia adicional, PIN exacto, sin modificar package.json ni lock.
          python3 scripts/ci_retry.py --attempts 3 --base-delay 3 \
            --label "axe-core 4.10.3" -- npm install --no-save --package-lock=false \
            --ignore-scripts --no-audit --no-fund --save-exact axe-core@4.10.3
          node -e "if (require('axe-core/package.json').version !== '4.10.3') process.exit(1)"
          git diff --exit-code -- package.json package-lock.json

      - name: Construir aplicación real
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build:admin
          test -s public/build/admin.js
          test -s public/build/admin.css
          git diff --exit-code -- public/build

      - name: Migrar y crear usuarios falsos descartables
        shell: bash
        run: |
          set -euo pipefail
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console app:onboarding:create \
            --name="Empresa E2E" --slug="empresa-e2e" \
            --legal-name="Empresa E2E SAS" --branch="Principal" \
            --email="$E2E_EMAIL" --owner-name="Propietario E2E"
          php bin/console app:platform-owner:provision \
            --email="$E2E_PLATFORM_EMAIL" --name="Propietario Plataforma E2E" \
            --password-env=CONDOR_PLATFORM_OWNER_PASSWORD

      - name: Iniciar servidor Symfony local
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t public public/router.php > /tmp/condor-webvitals-http.log 2>&1 &
          echo "$!" > /tmp/condor-webvitals-http.pid
          for intento in {1..30}; do
            if curl -fsS "$PLAYWRIGHT_BASE_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Servidor local no respondió al health"
          exit 1

      - name: Instalar Chromium y WebKit de Playwright
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_retry.py --attempts 3 --base-delay 3 \
            --label "Playwright Chromium WebKit" -- ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Ejecutar los tres flujos en ambos navegadores
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/playwright test tests/e2e/webvitals-a11y.spec.mjs \
            --project=chromium --project=webkit --workers=1 --retries=0

      - name: Publicar evidencia JSON exact-SHA incluso al fallar pruebas
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: webvitals-a11y-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/webvitals/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Detener servidor descartable
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/condor-webvitals-http.pid ]]; then
            kill "$(cat /tmp/condor-webvitals-http.pid)" 2>/dev/null || true
          fi
