name: Relay de hallazgos Sonar (V 0.1.0)

on:
  workflow_dispatch:
    inputs:
      check_run_id:
        description: ID del check run de Sonar que se quiere publicar
        required: true
        type: string
      pr_number:
        description: Número del Pull Request que recibirá el comentario
        required: true
        type: string

permissions:
  checks: read
  pull-requests: write

concurrency:
  group: sonar-relay-${{ github.repository }}-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  publicar:
    name: Publicar hallazgos de Sonar en la PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Leer anotaciones y actualizar comentario
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          MANUAL_CHECK_RUN_ID: ${{ inputs.check_run_id }}
          MANUAL_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          api_root = "https://api.github.com"
          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          event_name = os.environ["GH_EVENT_NAME"]
          event = json.loads(
              Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8")
          )

          def api(method, path, payload=None):
              data = None
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "condor-sonar-annotation-relay",
              }
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  api_root + path,
                  data=data,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"GitHub API {method} {path} falló: "
                      f"{error.code} {detail}"
                  ) from error

          if event_name == "workflow_dispatch":
              check_run_id = int(os.environ["MANUAL_CHECK_RUN_ID"])
              pr_number = int(os.environ["MANUAL_PR_NUMBER"])
              check_run = api(
                  "GET",
                  f"/repos/{repository}/check-runs/{check_run_id}",
              )
          else:
              check_run = event["check_run"]
              check_run_id = int(check_run["id"])
              pull_requests = check_run.get("pull_requests") or []
              pr_number = (
                  int(pull_requests[0]["number"])
                  if pull_requests
                  else 0
              )

          if check_run.get("name") != "SonarCloud Code Analysis":
              print(
                  "Check ignorado porque no corresponde a Sonar: "
                  f"{check_run.get('name')}"
              )
              raise SystemExit(0)

          head_sha = str(check_run.get("head_sha") or "")

          if event_name == "workflow_dispatch" and head_sha:
              associated = api(
                  "GET",
                  f"/repos/{repository}/commits/"
                  f"{urllib.parse.quote(head_sha)}/pulls?per_page=100",
              ) or []
              associated_numbers = {
                  int(item["number"])
                  for item in associated
                  if item.get("number")
              }
              if pr_number not in associated_numbers:
                  print(
                      f"El check {check_run_id} con head {head_sha} "
                      f"no corresponde a PR #{pr_number}; no se publica."
                  )
                  raise SystemExit(0)

          if pr_number == 0 and head_sha:
              associated = api(
                  "GET",
                  f"/repos/{repository}/commits/"
                  f"{urllib.parse.quote(head_sha)}/pulls?per_page=100",
              ) or []
              open_prs = [
                  item
                  for item in associated
                  if item.get("state") == "open"
              ]
              if open_prs:
                  pr_number = int(open_prs[0]["number"])

          if pr_number == 0:
              print(
                  f"No hay PR asociado al check Sonar {check_run_id}; "
                  "no se publica comentario."
              )
              raise SystemExit(0)

          annotations = []
          page = 1
          while True:
              batch = api(
                  "GET",
                  f"/repos/{repository}/check-runs/{check_run_id}/"
                  f"annotations?per_page=100&page={page}",
              ) or []
              annotations.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          def clean(value, limit=1000):
              text = " ".join(str(value or "").split())
              text = text.replace("@", "@\\u200b")
              text = text.replace(chr(96), "'")
              return text[:limit]

          marker = "<!-- condor-sonar-annotations -->"
          conclusion = clean(check_run.get("conclusion") or "desconocida", 40)
          details_url = str(check_run.get("details_url") or "").strip()

          gate_ok = conclusion == "success"
          gate_label = (
              "✅ **Quality Gate aprobado**"
              if gate_ok
              else f"❌ **Quality Gate no aprobado** — {conclusion}"
          )

          lines = [
              marker,
              "## SonarQube Cloud",
              "",
              gate_label,
              f"**{len(annotations)} hallazgos**",
          ]

          if details_url:
              lines.append(f"[Ver análisis completo]({details_url})")

          lines.append("")

          if not annotations:
              if not gate_ok:
                  lines.append(
                      "SonarQube no expuso anotaciones por línea para este fallo; "
                      "el detalle está disponible en el análisis completo."
                  )
          else:
              visible = annotations[:50]
              for index, annotation in enumerate(visible, 1):
                  path = clean(annotation.get("path"), 300)
                  start = annotation.get("start_line")
                  end = annotation.get("end_line")
                  location = path or "(sin archivo)"
                  if start:
                      location += f":{start}"
                      if end and end != start:
                          location += f"-{end}"

                  level = clean(
                      annotation.get("annotation_level") or "notice",
                      30,
                  ).upper()
                  title = clean(annotation.get("title"), 300)
                  message = clean(annotation.get("message"), 1200)
                  raw_details = clean(annotation.get("raw_details"), 1200)

                  heading = f"{index}. **{level}** — `{location}`"
                  if title:
                      heading += f" — {title}"
                  lines.append(heading)
                  if message:
                      lines.append(f"   - {message}")
                  if raw_details and raw_details != message:
                      lines.append(f"   - Detalle: {raw_details}")
                  lines.append("")

              if len(annotations) > len(visible):
                  lines.append(
                      f"_Mostrando los primeros {len(visible)} de "
                      f"{len(annotations)} hallazgos._"
                  )

          body = "\n".join(lines).strip() + "\n"

          comments = []
          comments_page = 1
          while True:
              batch = api(
                  "GET",
                  f"/repos/{repository}/issues/{pr_number}/"
                  f"comments?per_page=100&page={comments_page}",
              ) or []
              comments.extend(batch)
              if len(batch) < 100:
                  break
              comments_page += 1

          existing = next(
              (
                  comment
                  for comment in comments
                  if marker in str(comment.get("body") or "")
                  and str(
                      (comment.get("user") or {}).get("login") or ""
                  ).endswith("[bot]")
              ),
              None,
          )

          if existing:
              api(
                  "PATCH",
                  f"/repos/{repository}/issues/comments/{existing['id']}",
                  {"body": body},
              )
              print(
                  f"Comentario Sonar actualizado en PR #{pr_number}."
              )
          else:
              api(
                  "POST",
                  f"/repos/{repository}/issues/{pr_number}/comments",
                  {"body": body},
              )
              print(
                  f"Comentario Sonar creado en PR #{pr_number}."
              )
          PY
