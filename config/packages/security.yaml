security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

  providers:
    app_users:
      entity:
        class: App\Domain\Identity\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: app_users
      user_checker: App\Infrastructure\Security\ActiveUserChecker
      form_login:
        login_path: app_login
        check_path: app_login
        enable_csrf: true
        default_target_path: app_admin
      login_throttling:
        max_attempts: 10
        interval: '15 minutes'
      logout:
        path: app_logout
        target: app_login
        enable_csrf: true
        csrf_token_id: logout

  access_control:
    - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
    - { path: ^/superadmin, roles: ROLE_SUPER_ADMIN }
    - { path: ^/api/v1/context$, roles: ROLE_USER }
    - { path: ^/admin, roles: ROLE_USER }
