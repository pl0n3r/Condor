doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'
    charset: utf8mb4

  orm:
    enable_native_lazy_objects: true
    naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
    mappings:
      Condor:
        is_bundle: false
        type: attribute
        dir: '%kernel.project_dir%/src/Domain'
        prefix: 'App\Domain'
        alias: Condor
