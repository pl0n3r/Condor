framework:
  rate_limiter:
    platform_staff_invite_resend:
      policy: fixed_window
      limit: 5
      interval: '1 hour'

    invitation_activation:
      policy: sliding_window
      limit: 10
      interval: '15 minutes'

    password_reset_request_ip:
      policy: sliding_window
      limit: 10
      interval: '1 hour'

    password_reset_request_account:
      policy: sliding_window
      limit: 5
      interval: '1 hour'

    password_reset_consume_ip:
      policy: sliding_window
      limit: 20
      interval: '15 minutes'

    password_reset_consume_token:
      policy: sliding_window
      limit: 10
      interval: '15 minutes'

    password_change:
      policy: sliding_window
      limit: 5
      interval: '1 hour'
