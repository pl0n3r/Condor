framework:
  rate_limiter:
    # Ajustes solo del propietario: límite por identidad y por clave.
    platform_integrations_write:
      policy: sliding_window
      limit: 20
      interval: '1 minute'

    # Una prueba por minuto, incluso si alguien evita el botón de la UI.
    platform_integrations_test_email:
      policy: sliding_window
      limit: 1
      interval: '1 minute'

    platform_staff_invite_resend:
      policy: fixed_window
      limit: 5
      interval: '1 hour'

    invitation_activation:
      policy: sliding_window
      limit: 10
      interval: '15 minutes'

    storefront_checkout:
      policy: sliding_window
      limit: 10
      interval: '5 minutes'

    plan_configurator:
      policy: sliding_window
      limit: 240
      interval: '1 minute'

    plan_configurator_events:
      policy: sliding_window
      limit: 120
      interval: '1 minute'

    control_bot_api:
      policy: sliding_window
      limit: 60
      interval: '1 minute'

    password_reset_request_ip:
      policy: sliding_window
      limit: 5
      interval: '1 hour'

    password_reset_request_account:
      policy: sliding_window
      limit: 5
      interval: '1 hour'

    password_reset_consume_ip:
      policy: sliding_window
      limit: 20
      interval: '15 minutes'

    password_reset_consume_token:
      policy: sliding_window
      limit: 10
      interval: '15 minutes'

    password_change:
      policy: sliding_window
      limit: 5
      interval: '1 hour'
